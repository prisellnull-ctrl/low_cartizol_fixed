<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#eef0f3" id="metaTheme">
<script>try{var t=localStorage.getItem("pl.theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Плитки</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f3; --surface:#ffffff; --fg:#1c2027; --muted:#737a86; --line:#d9dde3; --soft:#e3e6eb;
  --accent:#4a5bd4; --danger:#c8423b;
  --ui:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --text:"Literata",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --kb:0px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#16191e;--surface:#1f232a;--fg:#e6e8ec;--muted:#8a919c;--line:#2c313a;--soft:#262b33;--accent:#8c9aff;--danger:#ef6f68}
}
:root[data-theme="dark"]{--bg:#16191e;--surface:#1f232a;--fg:#e6e8ec;--muted:#8a919c;--line:#2c313a;--soft:#262b33;--accent:#8c9aff;--danger:#ef6f68}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;touch-action:manipulation;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:16px/1.45 var(--ui);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- верхняя панель ---------- */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;margin-top:calc(-1 * env(safe-area-inset-top,0px));padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--bg);transition:box-shadow .2s}
.scrolled .bar{box-shadow:0 1px 0 var(--line),0 6px 16px rgba(0,0,0,.05)}
.editor .bar{margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);padding-left:max(14px,calc(50vw - 50% + 14px));padding-right:max(14px,calc(50vw - 50% + 14px))}
.bar h1{flex:1;margin:0;font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{min-width:40px;height:40px;border-radius:12px;display:inline-grid;place-items:center;padding:0 10px;font-weight:500}
.ibtn:active{background:var(--soft)}
.ibtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pill{height:36px;padding:0 14px;border-radius:18px;background:var(--soft);font-weight:500;font-size:15px}
.pill.on{background:var(--fg);color:var(--bg)}

/* ---------- главное меню ---------- */
.home{min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.home-head{width:min(100% - 32px,520px);margin:20px auto 0;padding-right:110px}
.home-head h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.02em}
.home-head .date{color:var(--muted);font-size:15px;margin-top:2px}
.grid-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 16px 7vh}
.edit-hint{margin-top:14px;color:var(--muted);font-size:13.5px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;width:min(100% - 40px,350px)}
@media (min-width:640px){.grid{width:min(100%,400px)}}
.tile{position:relative;aspect-ratio:1/1.08;border-radius:24px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;overflow:hidden;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .pic{width:68%;aspect-ratio:1;border-radius:18px;object-fit:cover;align-self:flex-end;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.tile .glyph{width:68%;aspect-ratio:1;border-radius:18px;align-self:flex-end;background:currentColor;opacity:.14}
.tile .name{font-size:17px;font-weight:600;line-height:1.15;letter-spacing:-.01em;word-break:break-word}
.editing .tile{animation:wob .9s ease-in-out infinite alternate}
.editing .tile:nth-child(2n){animation-delay:-.45s}
@keyframes wob{from{transform:rotate(-.8deg)}to{transform:rotate(.8deg)}}
.gear{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 18px);right:16px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:0 4px 16px rgba(0,0,0,.18)}
.gear svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
.gear.theme{right:72px}
.gear.on{background:var(--fg);color:var(--bg)}
.gear.on svg{transform:rotate(60deg)}
.editing .tile{touch-action:none;cursor:grab}
.tile.drag{animation:none!important;z-index:10;cursor:grabbing;box-shadow:0 18px 40px rgba(0,0,0,.28);pointer-events:none;transition:none}
.tile.add{border:2px dashed var(--line);background:transparent;color:var(--muted);align-items:center;justify-content:center;font-weight:500}

/* ---------- шторка (sheet) ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,12,16,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet:focus{outline:none}
.sheet{width:min(100%,560px);max-height:88vh;max-height:88dvh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.sheet h2{margin:0 0 14px;font-size:20px}
.field{margin-bottom:16px}
.field > span{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.inp{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.sw.on{border-color:var(--fg)}
.sw.custom{position:relative;overflow:hidden;background:conic-gradient(#ef6f6c,#f4d35e,#7cc6a4,#5fb3d9,#a78bfa,#ef6f6c)}
.sw.custom input{position:absolute;inset:0;opacity:0;cursor:pointer}
.imgrow{display:flex;align-items:center;gap:12px}
.imgrow .prev{width:64px;height:64px;border-radius:14px;object-fit:cover;background:var(--soft)}
.row-actions{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;height:48px;border-radius:14px;font-weight:600;background:var(--soft)}
.btn.primary{background:var(--fg);color:var(--bg)}
.btn.danger{color:var(--danger)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0}

/* ---------- пустая страница ---------- */
.empty{display:grid;place-items:center;text-align:center;color:var(--muted);padding:80px 24px}
.empty b{display:block;color:var(--fg);font-size:18px;margin-bottom:6px}

/* ---------- заметки: список ---------- */
.notes{width:min(100%,720px);margin:0 auto;padding-bottom:110px}
.search{margin:4px 14px 10px;position:relative}
.search input{width:100%;height:46px;border-radius:14px;border:0;background:var(--soft);padding:0 14px 0 40px;font-size:16px}
.search svg{position:absolute;left:12px;top:12px;width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:1.8}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:17px;background:var(--soft);font-size:14px;font-weight:500;white-space:nowrap}
.chip img{width:22px;height:22px;border-radius:7px;object-fit:cover;margin-left:-6px}
.chip.on{background:var(--fg);color:var(--bg)}
.chip.tag{background:transparent;border:1px solid var(--line)}
.chip.tag.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.ghost{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.list{list-style:none;margin:0;padding:4px 16px;display:flex;flex-direction:column;gap:14px}
/* стикер */
.note{--fold:34px;position:relative;cursor:pointer;outline-offset:3px;touch-action:pan-y;-webkit-user-select:none;user-select:none;transition:opacity .2s,transform .2s}
.note .card{position:relative;transform:translateX(var(--dx,0px));transition:transform .25s ease;filter:drop-shadow(0 2px 3px rgba(0,0,0,.07)) drop-shadow(0 8px 18px rgba(0,0,0,.06))}
.note.dragging .card{transition:none}
.note .swipe{position:absolute;inset:0;border-radius:22px;display:flex;align-items:center;padding:0 24px;color:#fff;font-weight:600;opacity:0}
.note[data-dir="left"] .swipe{opacity:1;background:var(--danger);justify-content:flex-end}
.note[data-dir="right"] .swipe{opacity:1;background:var(--accent);justify-content:flex-start}
.note.gone{opacity:0;transform:translateX(-40px)}
/* превью ссылок */
.lp{display:flex;align-items:center;gap:10px;margin:8px 0 0;padding:8px;border-radius:14px;background:rgba(255,255,255,.6);color:inherit;text-decoration:none;font-family:var(--ui);min-height:52px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lp{background:rgba(255,255,255,.06)}}
:root[data-theme="dark"] .lp{background:rgba(255,255,255,.06)}
.preview .lp{background:var(--soft);text-decoration:none;color:inherit}
.lp .th{width:52px;height:52px;flex:none;border-radius:10px;object-fit:cover;background:var(--soft)}
.lp .ico{width:22px;height:22px;flex:none;border-radius:6px;margin:0 4px}
.lp .tx{min-width:0;display:flex;flex-direction:column;gap:1px}
.lp b{font-size:14px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp .d{font-size:12.5px;line-height:1.35;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lp .host{font-size:12px;color:var(--accent)}
/* дыхание */
.breath{--c:#f2a65a;display:flex;flex-direction:column;align-items:center;min-height:calc(100dvh - 60px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding:0 20px 28px}
.stage{flex:1;display:grid;place-items:center;width:100%}
.ringbox{position:relative;width:min(80vw,330px);aspect-ratio:1;display:grid;place-items:center}
.halo{position:absolute;width:58%;aspect-ratio:1;border-radius:50%;background:var(--c);filter:blur(28px);opacity:.25;will-change:transform,opacity}
.orb{width:58%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 60%,#fff),var(--c) 70%);box-shadow:0 12px 40px color-mix(in srgb,var(--c) 45%,transparent);will-change:transform}
.phase,.sub,.cycle{transition:opacity .22s ease}
.phase{font-size:26px;font-weight:600;letter-spacing:-.01em;text-align:center;min-height:1.3em}
.sub{color:var(--muted);text-align:center;margin-top:4px;min-height:1.4em}
.cycle{color:var(--muted);font-size:14px;margin-top:18px;font-variant-numeric:tabular-nums}
.controls{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:22px;width:min(100%,320px)}
.controls .btn{flex:none;width:100%;height:56px;font-size:17px}
.swipe-host{position:relative;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.swipe-host > .card{position:relative;transform:translateX(var(--dx,0px));transition:transform .25s ease}
.swipe-host.dragging > .card{transition:none}
.swipe-host > .swipe{position:absolute;inset:0;border-radius:18px;display:flex;align-items:center;padding:0 22px;color:#fff;font-weight:600;opacity:0}
.swipe-host[data-dir="left"] > .swipe{opacity:1;background:var(--danger);justify-content:flex-end}
.swipe-host[data-dir="right"] > .swipe{opacity:1;background:var(--accent);justify-content:flex-start}
/* привычки */
.hab-page{width:min(100%,720px);margin:0 auto;padding:0 16px 40px}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px;margin:2px 0 18px}
.seg button{flex:1;height:38px;border-radius:10px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg.small{margin:0 0 10px;flex-wrap:wrap}.seg.small button{font-size:13px;height:34px;flex:1 1 40%}
.hab-month{margin:0;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.hab-date{color:var(--muted);margin:4px 0 14px}
.panel{background:var(--surface);border-radius:20px;padding:16px;margin-bottom:12px}
.sum{display:flex;gap:16px;align-items:center}
.donut{width:108px;height:108px;flex:none;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:10}
.donut .tr{stroke:var(--soft)}
.donut .v{stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.donut b{position:absolute;inset:0;display:grid;place-items:center;font-size:25px;font-weight:700;font-variant-numeric:tabular-nums}
.sum-tx{display:flex;flex-direction:column;gap:6px;font-size:14.5px;color:var(--muted);min-width:0}
.sum-tx b{color:var(--fg)}
.streak{align-self:flex-start;background:var(--soft);border-radius:10px;padding:5px 10px;color:var(--fg);font-size:13.5px;font-weight:500}
.bars{display:flex;align-items:flex-end;gap:2px;height:96px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bars .b{display:block;width:100%;max-width:10px;border-radius:4px;transition:height .4s ease}
.bars .fut{background:var(--soft)}
.bars .none{background:var(--line)}
.bars .fire{font-size:9px;line-height:1;margin-bottom:2px}
.bars .today .b{box-shadow:0 0 0 1.5px var(--surface),0 0 0 3px var(--fg)}
.bars-x{display:flex;gap:2px;margin-top:5px}
.bars-x span{flex:1;text-align:center;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.weeks{display:flex;justify-content:space-around;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);text-align:center}
.weeks b{display:block;color:var(--fg);font-size:14px;font-variant-numeric:tabular-nums}
.hab-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hab > .card{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:10px 12px}
.hab-img{width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:25px;font-weight:600;overflow:hidden;background:var(--soft)}
.hab-img img{width:100%;height:100%;object-fit:cover}
.hab-img.big{width:64px;height:64px;border-radius:14px;font-size:34px}
.hab-main{flex:1;min-width:0;display:flex;flex-direction:column}
.hab-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hab-sub{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.hab-sub .ok{color:#3f9a5d}.hab-sub .miss{color:var(--danger)}
.hab-bar{height:6px;border-radius:3px;background:var(--soft);margin-top:6px;overflow:hidden}
.hab-bar i{display:block;height:100%;border-radius:3px;transition:width .4s ease}
.chk{width:36px;height:36px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:background .15s,border-color .15s,transform .15s}
.chk:active{transform:scale(.9)}
.chk svg{width:18px;height:18px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.chk.on{background:#4caf6d;border-color:#4caf6d}.chk.on svg{opacity:1}
.chk:disabled{opacity:.35}
.add-h{width:100%;margin-top:12px;background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.cal-head{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.cal-head h2{flex:1;margin:0;font-size:24px;letter-spacing:-.02em;white-space:nowrap}
.pctpill{white-space:nowrap;background:var(--soft);border-radius:12px;padding:5px 10px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{text-align:center;font-size:12.5px;color:var(--muted);padding-bottom:4px}
.cal .d{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-variant-numeric:tabular-nums;background:var(--soft)}
.cal .d.has{background:color-mix(in srgb,var(--dc) 42%,var(--surface))}
.cal .d.fut{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .d.sel{outline:2px solid var(--fg);outline-offset:1px}
.cal .d .f{font-size:10px;line-height:1}
.day-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:4px;color:var(--muted);font-size:14px}
.day-head b{color:var(--fg);font-size:17px}
.day-row{display:flex;align-items:center;gap:12px;padding:8px 0}
.day-row .hab-img{width:38px;height:38px;font-size:21px}
.legend{text-align:center;color:var(--muted);font-size:13px;margin-top:4px}
.mgr{list-style:none;margin:0 0 14px;padding:0}
.mgr button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 0;border-bottom:1px solid var(--line)}
.wdpick{display:flex;gap:6px;flex-wrap:wrap}
.wdpick .chip{flex:1;justify-content:center;min-width:40px}
.dpick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dpick button{height:38px;border-radius:10px;background:var(--soft);font-variant-numeric:tabular-nums;font-size:14px}
.dpick button.on{background:var(--fg);color:var(--bg)}
.stepper{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stepper .btn{flex:none;width:46px;height:42px;font-size:20px}
.stepper b{font-size:22px;min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.stepper span{color:var(--muted);font-size:14px}
.plan-prev{margin-top:10px;font-size:13.5px;color:var(--muted)}
.goals{list-style:none;margin:0;padding:0 0 90px;display:flex;flex-direction:column;gap:10px}
.goal{display:flex;gap:14px;align-items:stretch;background:var(--surface);border-radius:22px;padding:12px;cursor:pointer}
.goal.closed{opacity:.85}
.g-img{width:84px;height:84px;flex:none;align-self:center;border-radius:16px;display:grid;place-items:center;font-size:40px;font-weight:700;overflow:hidden;background:color-mix(in srgb,var(--c) 35%,var(--surface));color:var(--fg)}
.g-img img{width:100%;height:100%;object-fit:cover}
.g-img.big{width:72px;height:72px;font-size:36px}
.goal.vault .g-img{filter:grayscale(.5)}
.g-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;justify-content:center}
.g-title{font-weight:600;font-size:17px;line-height:1.25}
.dl{font-size:13px;color:var(--muted)}
.dl.ok{color:#3f9a5d}.dl.warn{color:#c08a1c}.dl.bad{color:var(--danger)}
.g-prog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.g-prog .hab-bar{flex:1;margin:0}
.g-act{align-self:flex-start;margin-top:4px;height:34px;padding:0 14px;border-radius:17px;background:var(--fg);color:var(--bg);font-weight:600;font-size:14px}
.seg .cnt{font-weight:500;opacity:.6;font-size:12px;margin-left:2px}
#gseg button{white-space:nowrap;font-size:14px;padding:0 4px}
.gp-head{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.gp-time{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);margin-bottom:8px}

<body>
<div id="app"></div>

<script>
'use strict';
/* =========================================================
   Хранилище
   ========================================================= */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{ toast('Хранилище заполнено — уменьшите картинки или удалите лишнее'); } }
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const PALETTE = ['#6b8afd','#5fb3d9','#7cc6a4','#f4d35e','#f2a65a','#ef6f6c','#a78bfa','#e8e4da','#2d323b'];
const PAGE_TYPES = { blank: 'Пустая страница', notes: 'Заметки' };

let tiles = store.get('pl.tiles', [
  { id: uid(), title: 'Привычки',   color: '#6b8afd', img: null, type: 'habits' },
  { id: uid(), title: 'Дыхание',    color: '#f2a65a', img: null, type: 'breath' },
  { id: uid(), title: 'Цели',       color: '#7cc6a4', img: null, type: 'goals' },
  { id: uid(), title: 'Заметки',    color: '#e8e4da', img: null, type: 'notes' },
  { id: uid(), title: 'Дневник',    color: '#a78bfa', img: null, type: 'diary' },
  { id: uid(), title: 'Рынки',      color: '#5fb3d9', img: null, type: 'market' },
  { id: uid(), title: 'Знания',     color: '#f4d35e', img: null, type: 'know' }
]);
let nb = store.get('pl.notes', { folders: [], notes: [], tags: ['идея', 'работа', 'личное'] });
const saveTiles = () => store.set('pl.tiles', tiles);
if (tiles[0] && tiles[0].type === 'blank') {           // миграция: первая плитка стала трекером привычек
  tiles[0].type = 'habits';
  if (tiles[0].title === 'Страница 1') tiles[0].title = 'Привычки';
  saveTiles();
}
if (tiles[2] && tiles[2].type === 'blank') {           // миграция: третья плитка стала целями
  tiles[2].type = 'goals';
  if (tiles[2].title === 'Страница 3') tiles[2].title = 'Цели';
  saveTiles();
}
if (tiles[1] && tiles[1].type === 'blank') {           // миграция: вторая плитка стала дыхательной практикой
  tiles[1].type = 'breath';
  if (tiles[1].title === 'Страница 2') tiles[1].title = 'Дыхание';
  saveTiles();
}
// лишние плитки (пустые и повторы) убираем — в меню по одной на каждый раздел
{
  const seen = new Set(), before = tiles.length;
  tiles = tiles.filter(t => t.type !== 'blank' && !seen.has(t.type) && seen.add(t.type));
  if (tiles.length !== before) saveTiles();
}
if (!tiles.some(t => t.type === 'diary')) { tiles.push({ id: uid(), title: 'Дневник', color: '#a78bfa', img: null, type: 'diary' }); saveTiles(); }
if (!tiles.some(t => t.type === 'know')) { tiles.push({ id: uid(), title: 'Знания', color: '#f4d35e', img: null, type: 'know' }); saveTiles(); }
if (!tiles.some(t => t.type === 'market')) { tiles.push({ id: uid(), title: 'Рынки', color: '#5fb3d9', img: null, type: 'market' }); saveTiles(); }
const saveNb = () => store.set('pl.notes', nb);

/* =========================================================
   Утилиты
   ========================================================= */
function inkFor(hex){
  const n = parseInt(hex.slice(1), 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  return (0.299*r + 0.587*g + 0.114*b) > 150 ? '#1c2027' : '#ffffff';
}
function fmtTime(ts){
  const d = new Date(ts), now = new Date();
  const hm = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  if (d.toDateString() === now.toDateString()) return 'сегодня, ' + hm;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return 'вчера, ' + hm;
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' }) + ', ' + hm;
}
// картинку ужимаем до 320px, чтобы не забить localStorage
function readImage(file, max = 320){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        let url = c.toDataURL('image/webp', .85);
        if (!url.startsWith('data:image/webp')) url = c.toDataURL('image/jpeg', .85);
        res(url);
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
let toastT;
function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
}
const ICON = {

/* =========================================================
   Шторка (bottom sheet)
   ========================================================= */
function sheet(html, mount, onClose){
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  const close = () => { scrim.remove(); document.removeEventListener('keydown', onKey); onClose && onClose(); };
  const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
  scrim.addEventListener('click', e => { if (e.target === scrim) close(); });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(scrim);
  mount && mount($('.sheet', scrim), close);
  const sh = $('.sheet', scrim); sh.tabIndex = -1; sh.focus({ preventScroll: true });   // фокус на шторку, а не на поле — клавиатура не выскакивает
  return close;
}
function swatchesHTML(current){
  return PALETTE.map(c => `<button type="button" class="sw${c === current ? ' on' : ''}" data-c="${c}" style="background:${c}" aria-label="Цвет ${c}"></button>`).join('')
    + `<label class="sw custom${PALETTE.includes(current) ? '' : ' on'}" aria-label="Свой цвет"><input type="color" value="${current}"></label>`;
}

/* =========================================================
   Роутер
   ========================================================= */
const app = $('#app');
let editMode = false;
let lastRoute = '';
let guard = false;
let pageCleanup = null;

function parse(h){
  const p = h.replace(/^#\/?/, '').split('/');
  if (p[0] === 't' && p[1]) return { tile: p[1], note: p[2] === 'n' ? p[3] : null };
  return { home: true };
}
function route(){
  const h = location.hash;
  if (!guard) {
    const prev = parse(lastRoute), next = parse(h);
    if (prev.note && prev.note !== next.note && !leaveNoteOk(prev.note)) {
      guard = true; location.hash = lastRoute; guard = false; return;
    }
  }
  lastRoute = h;
  const r = parse(h);
  document.onkeydown = null;
  if (pageCleanup) { pageCleanup(); pageCleanup = null; }
  window.scrollTo(0, 0);
  if (r.home) return renderHome();
  const tile = tiles.find(t => t.id === r.tile);
  if (!tile) { location.hash = ''; return; }
  if (tile.type === 'notes') return r.note ? renderEditor(tile, r.note) : renderNotes(tile);
  if (tile.type === 'breath') return renderBreath(tile);
  if (tile.type === 'habits') return renderHabits(tile);
  if (tile.type === 'goals') return renderGoals(tile);
  if (tile.type === 'diary') return renderDiary(tile);
  if (tile.type === 'market') return renderMarket(tile);
  if (tile.type === 'know') return renderKnow(tile);
  renderBlank(tile);
}
window.addEventListener('hashchange', route);

window.addEventListener('scroll', () => document.body.classList.toggle('scrolled', scrollY > 4), { passive: true });

/* =========================================================
   Тема: светлая / ночная
   ========================================================= */
const isDark = () => (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
function syncThemeMeta(){ $('#metaTheme').content = isDark() ? '#16191e' : '#eef0f3'; }
function toggleTheme(){
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('pl.theme', next); } catch {}
  syncThemeMeta();
}
syncThemeMeta();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', syncThemeMeta);

/* =========================================================
   Главное меню
   ========================================================= */
function renderHome(){
  const d = new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
  app.innerHTML = `
  <main class="home">
    <div class="home-head">
      <h1>Меню</h1><div class="date">${d}</div>
    </div>
    <button class="gear theme" id="themeBtn" aria-label="${isDark() ? 'Дневной режим' : 'Ночной режим'}">${isDark() ? ICON.sun : ICON.moon}</button>
    <button class="gear${editMode ? ' on' : ''}" id="editBtn" aria-label="${editMode ? 'Закончить настройку' : 'Настроить плитки'}" aria-pressed="${editMode}">${ICON.gear}</button>
    <div class="grid-wrap">
      <div class="grid${editMode ? ' editing' : ''}${tiles.length > 6 ? ' many' : ''}" id="grid">
        ${tiles.map(t => `
          <button class="tile" data-id="${t.id}" style="background:${t.color};color:${inkFor(t.color)}">
            ${t.img ? `<img class="pic" src="${t.img}" alt="">` : `<span class="glyph"></span>`}
            <span class="name">${esc(t.title)}</span>
          </button>`).join('')}
      </div>
      ${editMode ? '<div class="edit-hint">Перетащите плитку, чтобы поменять порядок.<br>Нажмите, чтобы настроить.</div>' : ''}
    </div>
  </main>`;
  $('#editBtn').onclick = () => { editMode = !editMode; renderHome(); };
  $('#themeBtn').onclick = () => { toggleTheme(); renderHome(); };
  const grid = $('#grid');
  grid.onclick = e => {
    if (editMode) return;                       // в режиме настройки всё решает pointerup
    const t = e.target.closest('.tile[data-id]');
    if (t) location.hash = '#t/' + t.dataset.id;
  };
  grid.onkeydown = e => {                       // стрелки + Alt двигают плитку с клавиатуры
    if (!editMode || !e.altKey || !/Arrow(Left|Right|Up|Down)/.test(e.key)) return;
    const t = e.target.closest('.tile[data-id]'); if (!t) return;
    e.preventDefault();
    const i = tiles.findIndex(x => x.id === t.dataset.id), j = i + (/Left|Up/.test(e.key) ? -1 : 1);
    if (j < 0 || j >= tiles.length) return;
    [tiles[i], tiles[j]] = [tiles[j], tiles[i]]; saveTiles(); renderHome();
    $(`.tile[data-id="${t.dataset.id}"]`).focus();
  };
  if (!editMode) return;
  grid.querySelectorAll('.tile[data-id]').forEach(el => el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tileSheet(tiles.find(x => x.id === el.dataset.id)); } });
  let drag = null;
  grid.onpointerdown = e => {
    const t = e.target.closest('.tile[data-id]'); if (!t || e.button) return;
    const r = t.getBoundingClientRect();
    drag = { t, x: e.clientX, y: e.clientY, gx: e.clientX - r.left, gy: e.clientY - r.top, moved: false };
    grid.setPointerCapture(e.pointerId);
  };
  grid.onpointermove = e => {
    if (!drag) return;
    const { t } = drag;
    if (!drag.moved) {
      if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
      drag.moved = true; t.classList.add('drag');
    }
    const under = document.elementFromPoint(e.clientX, e.clientY)?.closest('.tile[data-id]');
    if (under && under !== t) {
      const all = [...grid.children], a = all.indexOf(t), b = all.indexOf(under);
      grid.insertBefore(t, a < b ? under.nextSibling : under);
      navigator.vibrate && navigator.vibrate(8);
    }
    t.style.transform = 'none';
    const r = t.getBoundingClientRect();
    t.style.transform = `translate(${e.clientX - drag.gx - r.left}px, ${e.clientY - drag.gy - r.top}px) scale(1.06)`;
  };
  const end = e => {
    if (!drag) return;
    const { t, moved } = drag; drag = null;
    if (!moved) { if (e.type === 'pointerup') tileSheet(tiles.find(x => x.id === t.dataset.id)); return; }
    t.classList.remove('drag'); t.style.transform = '';
    const order = [...grid.querySelectorAll('.tile[data-id]')].map(el => el.dataset.id);
    tiles.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
    saveTiles();
  };
  grid.onpointerup = end;
  grid.onpointercancel = end;
}

function tileSheet(tile){
  const isNew = !tile;
  const draft = tile ? { ...tile } : { id: uid(), title: '', color: PALETTE[tiles.length % PALETTE.length], img: null, type: 'blank' };
  sheet(`
    <h2>${isNew ? 'Новая плитка' : 'Плитка'}</h2>
    <label class="field"><span>Название</span><input class="inp" id="tName" value="${esc(draft.title)}" enterkeyhint="done" maxlength="40"></label>
    <div class="field"><span>Цвет</span><div class="swatches" id="tSw">${swatchesHTML(draft.color)}</div></div>
    <div class="field"><span>Картинка</span>
      <div class="imgrow">
        <img class="prev" id="tPrev" alt="" ${draft.img ? `src="${draft.img}"` : ''}>
        <label class="btn filebtn" style="flex:none;padding:0 16px;display:grid;place-items:center">Выбрать<input type="file" accept="image/*" id="tFile"></label>
        <button class="btn" style="flex:none;padding:0 16px" id="tNoImg">Убрать</button>
      </div>
    </div>
    <div class="field"><span>Данные плитки</span>
      <div class="data-acts">
        <button class="btn" id="tExp">Выгрузить</button>
        <label class="btn filebtn" style="display:grid;place-items:center">Загрузить<input type="file" accept="application/json,.json" id="tImp"></label>
        <button class="btn danger" id="tReset">Сбросить</button>
      </div>
    </div>
    <div class="row-actions">
      <button class="btn primary" id="tSave">Сохранить</button>
    </div>`, (el, close) => {
    $('#tExp', el).onclick = () => exportTile(tile);
    $('#tImp', el).onchange = e => { const f = e.target.files[0]; if (f) { close(); importTile(tile, f); } };
    $('#tReset', el).onclick = () => { close(); resetTile(tile); };
    const sw = $('#tSw', el);
    sw.onclick = e => {
      const b = e.target.closest('.sw[data-c]'); if (!b) return;
      draft.color = b.dataset.c; sw.innerHTML = swatchesHTML(draft.color); bindColor();
    };
    const bindColor = () => { $('input[type=color]', sw).oninput = e => { draft.color = e.target.value; sw.querySelectorAll('.sw').forEach(s => s.classList.toggle('on', s.classList.contains('custom'))); }; };
    bindColor();
    $('#tFile', el).onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try { draft.img = await readImage(f); $('#tPrev', el).src = draft.img; } catch { toast('Не получилось открыть картинку'); }
    };
    $('#tNoImg', el).onclick = () => { draft.img = null; $('#tPrev', el).removeAttribute('src'); };
    $('#tName', el).onkeydown = e => { if (e.key === 'Enter') $('#tSave', el).click(); };
    $('#tSave', el).onclick = () => {
      draft.title = $('#tName', el).value.trim() || 'Без названия';
      if (isNew) tiles.push(draft); else tiles[tiles.findIndex(t => t.id === draft.id)] = draft;
      saveTiles(); close(); renderHome();
    };
  });
}

function barHTML(title, right = ''){
  return `<header class="bar"><button class="ibtn" id="back" aria-label="Назад">${ICON.back}</button><h1>${esc(title)}</h1>${right}</header>`;
}

/* =========================================================
   Пустая страница (1–3)
   ========================================================= */
function renderBlank(tile){
  app.innerHTML = barHTML(tile.title) + `<div class="empty"><div><b>Страница пока пустая</b>Здесь появится её содержимое</div></div>`;
  $('#back').onclick = () => location.hash = '';
  document.onkeydown = e => { if (e.key === 'Escape') location.hash = ''; };
}

/* =========================================================
   Заметки — список
   ========================================================= */
const ui = { folder: 'all', q: '' };
const opened = new Set();

function filtered(){
  let list = nb.notes;
  if (ui.folder === 'none') list = list.filter(n => !n.folderId);
  else if (ui.folder !== 'all') list = list.filter(n => n.folderId === ui.folder);
  const q = ui.q.trim().toLowerCase();
  if (q.startsWith('#')) {
    const t = q.slice(1);
    if (t) list = list.filter(n => n.tags.some(x => x.toLowerCase().startsWith(t)));
  } else if (q) {
    list = list.filter(n => (n.title + '\n' + n.body + '\n' + n.tags.join(' ')).toLowerCase().includes(q));
  }
  return [...list].sort((a, b) => b.updated - a.updated);
}

function renderNotes(tile){
  const base = '#t/' + tile.id;
  app.innerHTML = barHTML(tile.title, `<button class="ibtn" id="tagsBtn" aria-label="Хештеги">${ICON.hash}</button>`) + `
  <main class="notes">
    <div class="search">${ICON.search}<input id="q" type="search" placeholder="#тег или текст" enterkeyhint="search" autocomplete="off" value="${esc(ui.q)}"></div>
    <div class="chips" id="tagSug"></div>
    <div class="chips" id="folders"></div>
    <ul class="list" id="list"></ul>
  </main>
  <button class="fab" id="newNote">${ICON.plus}Заметка</button>`;

  const drawFolders = () => {
    const f = nb.folders;
    const cur = f.find(x => x.id === ui.folder);
    $('#folders').innerHTML =
      `<button class="chip${ui.folder === 'all' ? ' on' : ''}" data-f="all">Все</button>` +
      f.map(x => `<button class="chip${ui.folder === x.id ? ' on' : ''}" data-f="${x.id}">${x.img ? `<img src="${x.img}" alt="">` : ''}${esc(x.name)}</button>`).join('') +
      (nb.notes.some(n => !n.folderId) && f.length ? `<button class="chip${ui.folder === 'none' ? ' on' : ''}" data-f="none">Без папки</button>` : '') +
      (cur ? `<button class="chip ghost" data-act="editf">Изменить папку</button>` : '') +
      `<button class="chip ghost" data-act="addf">+ Папка</button>`;
  };
  const drawSug = () => {
    const q = ui.q.trim().toLowerCase();
    const box = $('#tagSug');
    if (!q.startsWith('#')) { box.classList.add('hidden'); return; }
    const t = q.slice(1);
    const tags = nb.tags.filter(x => x.toLowerCase().startsWith(t));
    box.classList.toggle('hidden', !tags.length);
    box.innerHTML = tags.map(x => `<button class="chip tag${x.toLowerCase() === t ? ' on' : ''}" data-t="${esc(x)}">#${esc(x)}</button>`).join('');
  };
  const drawList = () => {
    const STK = ['#fff1b8','#d9f2e1','#dfe7ff','#ffe0d2','#eee0ff','#d7eff6','#f5e6c8'];
    const stColor = n => { const k = (n.tags[0] || n.id); let h = 0; for (const c of k) h = (h * 31 + c.charCodeAt(0)) >>> 0; return STK[h % STK.length]; };
    const list = filtered();
    if (!nb.notes.length) { $('#list').innerHTML = `<li class="hint">Заметок пока нет. Нажмите «Заметка», чтобы создать первую.</li>`; return; }
    if (!list.length) { $('#list').innerHTML = `<li class="hint">Ничего не найдено. Попробуйте другой тег или очистите поиск.</li>`; return; }
    const fname = id => nb.folders.find(f => f.id === id)?.name;
    $('#list').innerHTML = list.map(n => `
      <li class="note${opened.has(n.id) ? ' open' : ''}" data-id="${n.id}" tabindex="0" role="button" aria-label="${esc(n.title || 'Без названия')}" style="--st:${stColor(n)}">
        <div class="swipe"></div>
        <div class="card">
        <div class="paper">
          <div class="m">
            ${n.tags.length ? n.tags.map(t => `<span class="h">#${esc(t)}</span>`).join('') : '<span class="warn">нет хештега</span>'}
            ${fname(n.folderId) ? `<span>${esc(fname(n.folderId))}</span>` : ''}
            <span class="time">${fmtTime(n.updated)}</span>
          </div>
          <div class="t">${esc(n.title || 'Без названия')}</div>
          ${n.body.trim() ? `<div class="txt">${md(n.body)}${linkCards(n.body, 3)}</div>` : ''}
        </div>
        <button class="fold" aria-label="Развернуть или свернуть"></button>
        </div>
      </li>`).join('');
    measure();
    document.querySelectorAll('#list .note').forEach(el => attachSwipe(el, { left: { label: 'Удалить', run: reset => askDelete(el, reset) }, right: { label: 'Редактировать', run: () => location.hash = base + '/n/' + el.dataset.id } }));
    hydrateLinks($('#list'), measure);
  };
  // уголок появляется только если текст не влезает
  const measure = () => document.querySelectorAll('#list .note').forEach(el => {
    const txt = $('.txt', el); if (!txt) return;
    if (el.classList.contains('open')) { el.classList.add('long'); txt.style.maxHeight = txt.scrollHeight + 'px'; return; }
    el.classList.toggle('long', txt.scrollHeight > txt.clientHeight + 4);
  });

  function askDelete(el, reset){
    const n = nb.notes.find(x => x.id === el.dataset.id); if (!n) return reset();
    let done = false;
    sheet(`
      <h2>Удалить заметку?</h2>
      <p style="margin:0;color:var(--muted)">«${esc(n.title || 'Без названия')}» удалится без возможности восстановления.</p>
      <div class="row-actions">
        <button class="btn" id="dNo">Отмена</button>
        <button class="btn primary" id="dYes" style="background:var(--danger);color:#fff">Удалить</button>
      </div>`, (sh, close) => {
      $('#dNo', sh).onclick = close;
      $('#dYes', sh).onclick = () => {
        done = true; close();
        el.classList.add('gone');
        setTimeout(() => { nb.notes = nb.notes.filter(x => x.id !== n.id); opened.delete(n.id); saveNb(); drawAll(); }, 200);
      };
    }, () => { if (!done) reset(); });
  }
  const toggleNote = el => {
    const txt = $('.txt', el), id = el.dataset.id;
    const open = !el.classList.contains('open');
    el.classList.toggle('open', open);
    open ? opened.add(id) : opened.delete(id);
    txt.style.maxHeight = open ? txt.scrollHeight + 'px' : '';
    if (!open) { const r = el.getBoundingClientRect(); if (r.top < 60) el.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
  };
  const drawAll = () => { drawFolders(); drawSug(); drawList(); };
  drawAll();

  const q = $('#q');
  q.oninput = () => { ui.q = q.value; drawSug(); drawList(); };
  q.onkeydown = e => {
    if (e.key === 'Enter') { const f = $('#list .note'); f && (location.hash = base + '/n/' + f.dataset.id); }
    if (e.key === 'Escape' && q.value) { e.stopPropagation(); q.value = ui.q = ''; drawSug(); drawList(); }
    if (e.key === 'ArrowDown') { e.preventDefault(); $('#list .note')?.focus(); }
  };
  $('#tagSug').onclick = e => {
    const b = e.target.closest('[data-t]'); if (!b) return;
    ui.q = '#' + b.dataset.t; q.value = ui.q; drawSug(); drawList();
  };
  $('#folders').onclick = e => {
    const b = e.target.closest('.chip'); if (!b) return;
    if (b.dataset.act === 'addf') return folderSheet(null, drawAll);
    if (b.dataset.act === 'editf') return folderSheet(nb.folders.find(f => f.id === ui.folder), drawAll);
    ui.folder = b.dataset.f; drawAll();
  };
  $('#list').onclick = e => {
    const b = e.target.closest('.note'); if (!b) return;
    if (Date.now() - lastSwipe < 400) return;
    if (e.target.closest('.fold')) { e.stopPropagation(); return toggleNote(b); }
    if (e.target.closest('a')) return;
    location.hash = base + '/n/' + b.dataset.id;
  };
  $('#list').onkeydown = e => {
    const items = [...document.querySelectorAll('#list .note')], i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' && i > -1) { e.preventDefault(); items[i + 1]?.focus(); }
    if (e.key === 'ArrowUp' && i > -1) { e.preventDefault(); i ? items[i - 1].focus() : q.focus(); }
    if (e.key === 'Enter' && i > -1) { e.preventDefault(); location.hash = base + '/n/' + items[i].dataset.id; }
    if (e.key === ' ' && i > -1 && items[i].classList.contains('long')) { e.preventDefault(); toggleNote(items[i]); }
  };
  const newNote = () => {
    const now = Date.now();
    const n = { id: uid(), title: '', body: '', tags: [], folderId: ['all', 'none'].includes(ui.folder) ? null : ui.folder, created: now, updated: now };
    nb.notes.push(n); saveNb();
    location.hash = base + '/n/' + n.id;
  };
  $('#newNote').onclick = newNote;
  $('#tagsBtn').onclick = () => tagsSheet(drawAll);
  $('#back').onclick = () => location.hash = '';
  document.onkeydown = e => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (document.querySelector('.scrim')) return;
    if (e.key === '/' && !typing) { e.preventDefault(); q.focus(); }
    else if (e.key === 'n' && !typing && !e.ctrlKey && !e.metaKey) { e.preventDefault(); newNote(); }
    else if (e.key === 'Escape' && !typing) location.hash = '';
  };
}

  sheet(`

      saveNb(); ui.folder = d.id; close(); done();
    };

      nb.notes.forEach(n => { if (n.folderId === d.id) n.folderId = null; });
      nb.folders = nb.folders.filter(f => f.id !== d.id);
      saveNb(); ui.folder = 'all'; close(); done();
    });
  });
}

function tagsSheet(done){
  const draw = el => {
    $('#tl', el).innerHTML = nb.tags.length ? nb.tags.map(t => {
      const c = nb.notes.filter(n => n.tags.includes(t)).length;
      return `<li><span>#${esc(t)}<span class="n">${c ? c + ' зам.' : ''}</span></span><button class="ibtn" data-del="${esc(t)}" aria-label="Удалить #${esc(t)}">${ICON.trash}</button></li>`;
    }).join('') : '<li class="hint" style="padding:16px 0">Хештегов нет — добавьте первый</li>';
  };
  sheet(`
    <h2>Хештеги</h2>
    <ul class="taglist" id="tl"></ul>
    <div class="addrow"><input class="inp" id="tagIn" placeholder="новый хештег" enterkeyhint="done" autocapitalize="off" autocomplete="off"><button class="btn primary" id="tagAdd">Добавить</button></div>`,
  (el, close) => {
    draw(el);
    const inp = $('#tagIn', el);
    const add = () => {
      const v = inp.value.trim().replace(/^#+/, '').replace(/\s+/g, '_');
      if (!v) return;
      if (nb.tags.some(t => t.toLowerCase() === v.toLowerCase())) { toast('Такой хештег уже есть'); return; }
      nb.tags.push(v); nb.tags.sort((a, b) => a.localeCompare(b, 'ru'));
      saveNb(); inp.value = ''; draw(el); done && done(); inp.focus();
    };
    $('#tagAdd', el).onclick = add;
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); add(); } };
    $('#tl', el).onclick = e => {
      const b = e.target.closest('[data-del]'); if (!b) return;

      if (c && !confirm(`#${t} стоит в ${c} заметк${c === 1 ? 'е' : 'ах'}. Убрать его отовсюду?`)) return;
      nb.tags = nb.tags.filter(x => x !== t);
      nb.notes.forEach(n => n.tags = n.tags.filter(x => x !== t));
      saveNb(); draw(el); done && done();
    };
  });
}

let preview = false;
function renderEditor(tile, id){
  const n = nb.notes.find(x => x.id === id);
  const base = '#t/' + tile.id;
  if (!n) { location.hash = base; return; }

  app.innerHTML = `
  <div class="editor">
    <header class="bar">
      <button class="ibtn" id="back" aria-label="Назад">${ICON.back}</button>
      <h1></h1>
      <button class="ibtn" id="pv" aria-label="Просмотр" title="Просмотр (Ctrl+P)">${preview ? ICON.pen : ICON.eye}</button>

  </div>
  <div class="tools" id="tools"><div class="in">
    <button data-md="h" title="Заголовок">H</button>
    <button data-md="b" title="Жирный (Ctrl+B)"><b>B</b></button>
    <button data-md="i" title="Курсив (Ctrl+I)"><i>I</i></button>
    <button data-md="s" title="Зачёркнутый"><s>S</s></button>
    <span class="sep"></span>
    <button data-md="ul" title="Список">•</button>
    <button data-md="ol" title="Нумерованный список">1.</button>
    <button data-md="task" title="Задача">☐</button>
    <button data-md="q" title="Цитата">❝</button>
    <span class="sep"></span>
    <button data-md="code" title="Код">&lt;/&gt;</button>
    <button data-md="link" title="Ссылка">🔗</button>
    <button data-md="hr" title="Разделитель">—</button>
  </div></div>`;

  const ta = $('#ta'), title = $('#title'), out = $('#out');
  const stamp = () => $('#stamp').textContent = 'Изменено ' + fmtTime(n.updated);
  const drawTags = () => {
    const row = $('#tags');
    row.innerHTML = nb.tags.length
      ? nb.tags.map(t => `<button class="chip tag${n.tags.includes(t) ? ' on' : ''}" data-t="${esc(t)}">#${esc(t)}</button>`).join('') + `<button class="chip ghost" data-act="manage">Изменить</button>`
      : `<button class="chip ghost" data-act="manage">+ Добавить хештеги</button>`;
  };
  let t;
  const touch = () => { n.updated = Date.now(); stamp(); clearTimeout(t); t = setTimeout(saveNb, 250); };
  stamp(); drawTags();

  title.oninput = () => { n.title = title.value; touch(); };
  title.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); preview ? null : ta.focus(); } };
  ta.oninput = () => { n.body = ta.value; touch(); };
  $('#folder').onchange = e => { n.folderId = e.target.value || null; touch(); };
  $('#tags').onclick = e => {
    const b = e.target.closest('.chip'); if (!b) return;
    if (b.dataset.act === 'manage') return tagsSheet(drawTags);
    const tg = b.dataset.t;
    n.tags = n.tags.includes(tg) ? n.tags.filter(x => x !== tg) : [...n.tags, tg];
    $('#tags').classList.remove('need'); document.querySelectorAll('.toast').forEach(x => x.remove()); drawTags(); touch();
  };

  const setPreview = (on, user) => {
    preview = on;
    ta.classList.toggle('hidden', on); out.classList.toggle('hidden', !on);
    $('#tools').classList.toggle('hidden', on);
    $('#pv').innerHTML = on ? ICON.pen : ICON.eye;
    $('#pv').setAttribute('aria-label', on ? 'Редактировать' : 'Просмотр');
    if (on) { ta.blur(); out.innerHTML = md(n.body) + linkCards(n.body, 8); hydrateLinks(out); } else if (user) ta.focus();
  };
  $('#pv').onclick = () => setPreview(!preview, true);
  setPreview(preview);

  // чекбоксы в режиме просмотра переключают [ ] ↔ [x] в тексте
  out.onchange = e => {
    const cb = e.target.closest('input[data-line]'); if (!cb) return;
    const lines = n.body.split('\n'), i = +cb.dataset.line;
    lines[i] = lines[i].replace(/\[( |x|X)\]/, cb.checked ? '[x]' : '[ ]');
    n.body = ta.value = lines.join('\n'); touch();
  };

  $('#back').onclick = () => location.hash = base;
  $('#del').onclick = () => {
    if (!confirm('Удалить заметку?')) return;
    nb.notes = nb.notes.filter(x => x.id !== n.id); saveNb();
    guard = true; location.hash = base; guard = false;
  };

  /* ---- панель Markdown ---- */
  const tools = $('#tools');
  tools.addEventListener('pointerdown', e => { if (e.target.closest('button')) e.preventDefault(); }); // не терять фокус и клавиатуру
  tools.onclick = e => { const b = e.target.closest('[data-md]'); if (b) mdAction(b.dataset.md); };

  function replaceSel(text, selStart, selEnd){
    ta.focus();
    ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, 'end');
    if (selStart != null) ta.setSelectionRange(selStart, selEnd);
    ta.dispatchEvent(new Event('input'));
  }
  function wrap(mark){
    const s = ta.selectionStart, e = ta.selectionEnd, sel = ta.value.slice(s, e);
    replaceSel(mark + sel + mark, s + mark.length, s + mark.length + sel.length);
  }
  function linePrefix(pre, toggle = true){
    const v = ta.value, s = ta.selectionStart, e = ta.selectionEnd;
    const ls = v.lastIndexOf('\n', s - 1) + 1;
    let le = v.indexOf('\n', e); if (le < 0) le = v.length;
    const lines = v.slice(ls, le).split('\n');
    const all = lines.every(l => l.startsWith(pre));
    const res = lines.map((l, i) => {
      const p = typeof pre === 'function' ? pre(i) : pre;
      return toggle && all ? l.slice(p.length) : p + l.replace(/^(#{1,6} |[-*+] \[[ xX]\] |[-*+] |\d+\. |> )/, '');
    }).join('\n');
    ta.setSelectionRange(ls, le);
    replaceSel(res);
  }
  function mdAction(a){
    if (preview) return;
    const s = ta.selectionStart, e = ta.selectionEnd, sel = ta.value.slice(s, e);
    switch (a) {
      case 'b': return wrap('**');
      case 'i': return wrap('*');
      case 's': return wrap('~~');
      case 'code':
        return sel.includes('\n') ? replaceSel('```\n' + sel + '\n```') : wrap('`');
      case 'h': {
        const v = ta.value, ls = v.lastIndexOf('\n', s - 1) + 1;
        const m = v.slice(ls).match(/^(#{1,6}) /);
        const lvl = m ? m[1].length : 0;
        ta.setSelectionRange(ls, ls + (m ? m[0].length : 0));
        const next = lvl >= 3 ? '' : '#'.repeat(lvl + 1) + ' ';
        replaceSel(next);
        const nv = ta.value; let end = nv.indexOf('\n', ls); if (end < 0) end = nv.length;
        ta.setSelectionRange(end, end); return;
      }
      case 'ul': return linePrefix('- ');
      case 'task': return linePrefix('- [ ] ');
      case 'q': return linePrefix('> ');
      case 'ol': {
        const v = ta.value, ls = v.lastIndexOf('\n', s - 1) + 1;
        let le = v.indexOf('\n', e); if (le < 0) le = v.length;
        const lines = v.slice(ls, le).split('\n');
        const all = lines.every(l => /^\d+\. /.test(l));
        ta.setSelectionRange(ls, le);
        return replaceSel(lines.map((l, i) => all ? l.replace(/^\d+\. /, '') : (i + 1) + '. ' + l.replace(/^([-*+] \[[ xX]\] |[-*+] |> )/, '')).join('\n'));
      }
      case 'link': {
        const txt = sel || 'текст';
        replaceSel(`[${txt}](https://)`);
        const pos = ta.selectionEnd - 1; ta.setSelectionRange(pos, pos); return;
      }
      case 'hr': return replaceSel((s && ta.value[s - 1] !== '\n' ? '\n' : '') + '\n---\n');
    }
  }

  // Enter продолжает списки, пустой пункт — завершает список
  ta.onkeydown = e => {
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === 'b') { e.preventDefault(); return mdAction('b'); }
    if (mod && e.key.toLowerCase() === 'i') { e.preventDefault(); return mdAction('i'); }
    if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); return mdAction('link'); }
    if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
    const v = ta.value, s = ta.selectionStart;
    if (s !== ta.selectionEnd) return;
    const ls = v.lastIndexOf('\n', s - 1) + 1, line = v.slice(ls, s);
    const m = line.match(/^(\s*)([-*+] \[[ xX]\] |[-*+] |(\d+)\. |> )/);
    if (!m) return;
    e.preventDefault();
    if (line.trim() === m[0].trim()) {             // пустой пункт → выходим из списка
      ta.setSelectionRange(ls, s); replaceSel(''); return;
    }
    let pre = m[2];
    if (m[3]) pre = (+m[3] + 1) + '. ';
    if (/\[[ xX]\]/.test(pre)) pre = pre.replace(/\[[ xX]\]/, '[ ]');
    replaceSel('\n' + m[1] + pre);
  };

  document.onkeydown = e => {
    if (document.querySelector('.scrim')) return;
    const mod = e.ctrlKey || e.metaKey;
    if (mod && (e.key.toLowerCase() === 'p' || e.key.toLowerCase() === 'e')) { e.preventDefault(); setPreview(!preview, true); }
    else if (e.key === 'Escape') { e.preventDefault(); location.hash = base; }
  };
}

/* =========================================================
   Превью ссылок
   Браузер не даёт читать чужие сайты напрямую (CORS), поэтому
   заголовок/описание/картинку отдаёт сервис microlink.io.
   Результат кэшируется, повторно ссылка не запрашивается.
   ========================================================= */
let lpCache = store.get('pl.lp', {});
const lpWait = {};
function extractLinks(body){
  const clean = body.replace(/```[\s\S]*?```/g, '').replace(/`[^`]*`/g, '');
  const found = [];
  clean.replace(/\]\((https?:\/\/[^)\s]+)\)|(^|[\s(])(https?:\/\/[^\s<)]+[^\s<.,;:!?)'"])/g, (m, a, _, b) => { const u = a || b; if (!found.includes(u)) found.push(u); return m; });
  return found;
}
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };
function lpHTML(u){
  const c = lpCache[u], host = hostOf(u);
  const img = c && c.img ? `<img class="th" src="${esc(c.img)}" alt="" loading="lazy" onerror="this.remove()">`
            : `<img class="ico" src="${esc(c && c.logo || `https://icons.duckduckgo.com/ip3/${host}.ico`)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`;
  return `<a class="lp" href="${esc(u)}" target="_blank" rel="noopener" data-lp="${esc(u)}">${img}<span class="tx">
    <b>${esc(c && c.t || host)}</b>${c && c.d ? `<span class="d">${esc(c.d)}</span>` : ''}<span class="host">${esc(host)}</span></span></a>`;
}
function linkCards(body, max){ return extractLinks(body).slice(0, max).map(lpHTML).join(''); }
function fetchLp(u){
  if (lpCache[u] || !navigator.onLine) return Promise.resolve();
  return lpWait[u] ||= fetch('https://api.microlink.io/?url=' + encodeURIComponent(u))
    .then(r => r.json())
    .then(j => {
      const d = j && j.data || {};
      lpCache[u] = { t: d.title || '', d: d.description || '', img: d.image && d.image.url || '', logo: d.logo && d.logo.url || '', ts: Date.now() };
    })
    .catch(() => { lpCache[u] = { t: '', d: '', img: '', logo: '', ts: Date.now() }; })
    .finally(() => {
      const keys = Object.keys(lpCache);
      if (keys.length > 200) keys.sort((a, b) => lpCache[a].ts - lpCache[b].ts).slice(0, keys.length - 200).forEach(k => delete lpCache[k]);
      store.set('pl.lp', lpCache); delete lpWait[u];
    });
}
function hydrateLinks(root, after){
  const nodes = [...root.querySelectorAll('a.lp[data-lp]')].filter(a => !lpCache[a.dataset.lp]);
  const urls = [...new Set(nodes.map(a => a.dataset.lp))];
  urls.forEach(u => fetchLp(u).then(() => {
    root.querySelectorAll(`a.lp[data-lp="${CSS.escape(u)}"]`).forEach(a => { a.outerHTML = lpHTML(u); });
    after && after();
  }));
}

/* =========================================================
   Дыхательная практика: квадратное дыхание 4-4-4-4, 5 циклов
   ========================================================= */
function renderBreath(tile){
  const PH = [
    { t: 'Вдох',     s: 'медленно втягивайте воздух носом', from: 1,    to: 1.55 },
    { t: 'Задержка', s: 'не дышите',                        from: 1.55, to: 1.55 },
    { t: 'Выдох',    s: 'плавно выпускайте воздух',         from: 1.55, to: 1 },
    { t: 'Задержка', s: 'перед новым вдохом',               from: 1,    to: 1 }
  ];
  const DUR = 4000, CYCLES = 5;
  const IDLE = ['Квадратное дыхание', '4 секунды на каждую сторону', '5 циклов, 80 секунд'];
  app.innerHTML = barHTML(tile.title) + `
  <main class="breath" style="--c:${tile.color}">
    <div class="stage">
      <div class="ringbox">
        <div class="halo" id="halo"></div>
        <div class="orb" id="orb"></div>
      </div>
    </div>
    <div class="phase" id="phase" aria-live="polite">${IDLE[0]}</div>
    <div class="sub" id="sub">${IDLE[1]}</div>
    <div class="cycle" id="cycle">${IDLE[2]}</div>
    <div class="controls">
      <button class="btn primary" id="go">Старт</button>
      <button class="textbtn hidden" id="reset">Сбросить</button>
    </div>
  </main>`;
  const orb = $('#orb'), halo = $('#halo'), go = $('#go'), rs = $('#reset');
  const st = { run: false, started: false, done: false, cycle: 0, ph: 0, el: 0, last: 0, raf: 0 };
  let lock = null, shown = '';
  const ease = t => (1 - Math.cos(Math.PI * t)) / 2;
  const buzz = p => navigator.vibrate && navigator.vibrate(p);

  // мягкая смена надписей: гаснет → меняется → проявляется
  function say(t, s, c){
    const key = t + '|' + s + '|' + c;
    if (key === shown) return; shown = key;
    const els = [$('#phase'), $('#sub'), $('#cycle')];
    els.forEach(e => e.style.opacity = 0);
    setTimeout(() => { $('#phase').textContent = t; $('#sub').textContent = s; $('#cycle').textContent = c; els.forEach(e => e.style.opacity = 1); }, 220);
  }
  function scale(sc){
    orb.style.transform = `scale(${sc})`;
    halo.style.transform = `scale(${1 + (sc - 1) * 1.25})`;
    halo.style.opacity = .25 + (sc - 1) * .9;
  }
  function draw(){
    const p = PH[st.ph], k = Math.min(1, st.el / DUR);
    scale(p.from + (p.to - p.from) * ease(k));
    if (st.run) say(p.t, p.s, `Цикл ${st.cycle + 1} из ${CYCLES}`);
    else say('Пауза', `остановлено на фазе «${p.t.toLowerCase()}»`, `Цикл ${st.cycle + 1} из ${CYCLES}`);
  }
  function frame(ts){
    if (!st.run) return;
    st.el += ts - st.last; st.last = ts;
    while (st.el >= DUR) {
      st.el -= DUR; st.ph++;
      if (st.ph === PH.length) { st.ph = 0; st.cycle++; }
      if (st.cycle >= CYCLES) return finish();
      buzz(25);
    }
    draw();
    st.raf = requestAnimationFrame(frame);
  }
  async function keepAwake(){ try { lock = await navigator.wakeLock?.request('screen'); } catch {} }
  function release(){ try { lock && lock.release(); } catch {} lock = null; }
  function start(){
    if (st.done || !st.started) Object.assign(st, { done: false, cycle: 0, ph: 0, el: 0 });
    st.started = true; st.run = true; st.last = performance.now();
    go.textContent = 'Пауза'; rs.classList.add('hidden');
    buzz(25); keepAwake();
    st.raf = requestAnimationFrame(frame);
  }
  function pause(){
    st.run = false; cancelAnimationFrame(st.raf); release();
    go.textContent = 'Продолжить'; rs.classList.remove('hidden'); draw();
  }
  function settle(){
    orb.style.transition = halo.style.transition = 'transform 1.2s ease, opacity 1.2s ease';
    scale(1);
    setTimeout(() => orb.style.transition = halo.style.transition = '', 1250);
  }
  function finish(){
    st.run = false; st.done = true; st.started = false; release(); settle();
    say('Готово', 'Посидите пару секунд, дышите как обычно', `${CYCLES} циклов пройдено`);
    go.textContent = 'Ещё раз'; rs.classList.add('hidden');
    buzz([60, 80, 60]);
  }
  function reset(){
    cancelAnimationFrame(st.raf); release();
    Object.assign(st, { run: false, started: false, done: false, cycle: 0, ph: 0, el: 0 });
    settle(); say(...IDLE);
    go.textContent = 'Старт'; rs.classList.add('hidden');
  }
  scale(1);
  go.onclick = () => st.run ? pause() : start();
  rs.onclick = reset;
  $('#back').onclick = () => location.hash = '';
  document.onkeydown = e => {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); go.click(); }
    if (e.key === 'Escape') location.hash = '';
  };
  const onVis = () => { if (document.hidden && st.run) pause(); else if (!document.hidden && st.run) keepAwake(); };
  document.addEventListener('visibilitychange', onVis);
  pageCleanup = () => { cancelAnimationFrame(st.raf); release(); document.removeEventListener('visibilitychange', onVis); };
}

/* =========================================================
   Общий свайп: влево / вправо с порогом и «резинкой»
   ========================================================= */
let lastSwipe = 0;
function attachSwipe(el, o){
  const TH = 90;
  let x0 = 0, y0 = 0, dx = 0, on = false, axis = null;
  const bg = el.querySelector(':scope > .swipe');
  const set = v => {
    if (v < 0 && !o.left) v = 0;
    if (v > 0 && !o.right) v = 0;
    dx = v; el.style.setProperty('--dx', v + 'px');
    el.dataset.dir = v < -8 ? 'left' : v > 8 ? 'right' : '';
    if (bg) bg.textContent = v < 0 ? o.left.label : v > 0 ? o.right.label : '';
  };
  const reset = () => { el.classList.remove('dragging'); set(0); };
  el.addEventListener('pointerdown', e => {
    if (e.button || e.target.closest('.fold, a, .chk')) return;
    x0 = e.clientX; y0 = e.clientY; on = true; axis = null;
  });
  el.addEventListener('pointermove', e => {
    if (!on) return;
    const mx = e.clientX - x0, my = e.clientY - y0;
    if (!axis && Math.hypot(mx, my) > 10) {
      axis = Math.abs(mx) > Math.abs(my) * 1.2 ? 'x' : 'y';
      if (axis === 'x') { el.setPointerCapture(e.pointerId); el.classList.add('dragging'); }
    }
    if (axis !== 'x') return;
    set(Math.abs(mx) > TH ? Math.sign(mx) * (TH + (Math.abs(mx) - TH) * .35) : mx);
  });
  el.addEventListener('pointerup', () => {
    if (!on) return; on = false;
    if (axis !== 'x') return;
    lastSwipe = Date.now();
    el.classList.remove('dragging');
    if (dx <= -TH && o.left) { set(-TH); navigator.vibrate && navigator.vibrate(15); o.left.run(reset); }
    else if (dx >= TH && o.right) { reset(); o.right.run(); }
    else reset();
  });
  el.addEventListener('pointercancel', () => { on = false; reset(); });
}
function confirmSheet(title, text, yes, onNo, yesLabel = 'Удалить'){
  let done = false;
  sheet(`
    <h2>${esc(title)}</h2>
    <p style="margin:0;color:var(--muted)">${esc(text)}</p>
    <div class="row-actions">
      <button class="btn" id="cNo">Отмена</button>
      <button class="btn" id="cYes" style="background:var(--danger);color:#fff">${yesLabel}</button>
    </div>`, (sh, close) => {
    $('#cNo', sh).onclick = close;
    $('#cYes', sh).onclick = () => { done = true; close(); yes(); };
  }, () => { if (!done && onNo) onNo(); });
}

/* =========================================================
   Привычки
   ========================================================= */
let hb = store.get('pl.habits', { habits: [], log: {}, plan: {} });
const saveHb = () => store.set('pl.habits', hb);
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const isoDow = d => (d.getDay() + 6) % 7 + 1;
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_G = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const WD_FULL = ['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
const todayKey = () => ymd(new Date());

// N раз в месяц → равные интервалы: 2 раза в 30 днях = 1 и 16 число
function spread(n, D){ n = Math.max(1, Math.min(n, D)); const r = []; for (let i = 0; i < n; i++) r.push(Math.floor(i * D / n) + 1); return r; }
function scheduled(h, date){
  const k = ymd(date);
  if (h.created && k < h.created) return false;
  if (h.archivedAt && k >= h.archivedAt) return false;
  const day = date.getDate(), D = dim(date.getFullYear(), date.getMonth());
  switch (h.mode) {
    case 'weekdays': return h.days.includes(isoDow(date));
    case 'dates':    return h.dates.some(x => Math.min(x, D) === day);
    case 'monthly':  return spread(h.perMonth || 1, D).includes(day);
    default:         return true;
  }
}
// прошлые дни берутся из снимка плана (чтобы правка настроек не переписывала историю)
function planFor(date){
  const k = ymd(date), t = todayKey();
  if (k < t && hb.plan[k]) return hb.plan[k];
  const p = hb.habits.filter(h => scheduled(h, date)).map(h => h.id);
  if (k === t && JSON.stringify(p) !== JSON.stringify(hb.plan[k])) { hb.plan[k] = p; saveHb(); }
  return p;
}
function dayStat(date){
  const p = planFor(date); if (!p.length) return null;
  const done = (hb.log[ymd(date)] || []).filter(id => p.includes(id)).length;
  return { done, total: p.length, pct: done / p.length };
}
function mixHex(a, b, t){
  const pa = [1,3,5].map(i => parseInt(a.substr(i, 2), 16)), pb = [1,3,5].map(i => parseInt(b.substr(i, 2), 16));
  return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
const RED = '#e5707a', YEL = '#e8b54a', GRN = '#4caf6d';
const pctColor = p => p < .5 ? mixHex(RED, YEL, p / .5) : mixHex(YEL, GRN, (p - .5) / .5);
function schedText(h){
  switch (h.mode) {
    case 'weekdays': return h.days.length === 7 ? 'каждый день' : [...h.days].sort().map(d => WD[d - 1]).join(', ');
    case 'dates':    return 'числа: ' + [...h.dates].sort((a, b) => a - b).join(', ');
    case 'monthly':  return `${h.perMonth} раз в месяц`;
    default:         return 'каждый день';
  }
}
function habIcon(h){
  if (h.img) return `<img src="${h.img}" alt="">`;
  if (h.emoji) return esc(h.emoji);
  return esc((h.name || '?').trim().charAt(0).toUpperCase());
}
function monthStats(y, m){
  const D = dim(y, m), now = new Date(), t = todayKey();
  const per = {}; let done = 0, total = 0;
  for (let d = 1; d <= D; d++) {
    const date = new Date(y, m, d), k = ymd(date), p = planFor(date), log = hb.log[k] || [];
    p.forEach(id => {
      per[id] ||= { planned: 0, done: 0 };
      per[id].planned++;
      if (log.includes(id)) per[id].done++;
    });
    if (k <= t) { total += p.length; done += log.filter(id => p.includes(id)).length; }
  }
  return { per, done, total, pct: total ? done / total : 0 };
}
function streak(){
  const first = hb.habits.reduce((a, h) => !a || h.created < a ? h.created : a, null);
  if (!first) return 0;
  let n = 0; const d = new Date();
  const t = dayStat(d);
  if (!t || t.pct < 1) d.setDate(d.getDate() - 1);
  for (let i = 0; i < 400 && ymd(d) >= first; i++, d.setDate(d.getDate() - 1)) {
    const r = dayStat(d);
    if (!r) continue;
    if (r.pct < 1) break;
    n++;
  }
  return n;
}
function toggleDone(id, date){
  const k = ymd(date);
  const arr = hb.log[k] ||= [];
  const i = arr.indexOf(id);
  i < 0 ? arr.push(id) : arr.splice(i, 1);
  if (!arr.length) delete hb.log[k];
  saveHb();
  navigator.vibrate && navigator.vibrate(10);
}
const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
