      <button class="btn primary" id="hSave">Сохранить</button>
    </div>`, (el, close) => {
    const prev = () => $('#hPrev', el).innerHTML = habIcon({ ...d, name: $('#hName', el).value || d.name });
    const drawOpt = () => {
      el.querySelectorAll('#hMode button').forEach(b => b.classList.toggle('on', b.dataset.m === d.mode));
      const o = $('#hOpt', el);
      if (d.mode === 'weekdays') o.innerHTML = `<div class="wdpick">${WD.map((w, i) => `<button class="chip${d.days.includes(i + 1) ? ' on' : ''}" data-wd="${i + 1}">${w}</button>`).join('')}</div>`;
      else if (d.mode === 'dates') o.innerHTML = `<div class="dpick">${Array.from({ length: 31 }, (_, i) => `<button class="${d.dates.includes(i + 1) ? 'on' : ''}" data-dt="${i + 1}">${i + 1}</button>`).join('')}</div>`;
      else if (d.mode === 'monthly') o.innerHTML = `<div class="stepper"><button class="btn" data-st="-1">−</button><b id="hN">${d.perMonth}</b><button class="btn" data-st="1">+</button><span>раз в месяц, равными интервалами</span></div>`;
      else o.innerHTML = '';
      // предпросмотр на текущий месяц
      const now = new Date(), y = now.getFullYear(), m = now.getMonth(), D = dim(y, m), days = [];
      for (let i = 1; i <= D; i++) if (scheduled({ ...d, created: null, archivedAt: null }, new Date(y, m, i))) days.push(i);
      $('#hPlan', el).textContent = d.mode === 'daily' ? `В ${MONTHS_G[m].replace(/я$/, 'е').replace(/а$/, 'е')}: каждый день, ${D} раз`
        : days.length ? `В этом месяце (${days.length}): ${days.join(', ')}` : 'Выберите хотя бы один день';
    };
    drawOpt();
    $('#hMode', el).onclick = e => { const b = e.target.closest('[data-m]'); if (b) { d.mode = b.dataset.m; drawOpt(); } };
    $('#hOpt', el).onclick = e => {
      const w = e.target.closest('[data-wd]'), t = e.target.closest('[data-dt]'), s = e.target.closest('[data-st]');
      if (w) { const v = +w.dataset.wd; d.days = d.days.includes(v) ? d.days.filter(x => x !== v) : [...d.days, v]; }
      if (t) { const v = +t.dataset.dt; d.dates = d.dates.includes(v) ? d.dates.filter(x => x !== v) : [...d.dates, v]; }
      if (s) d.perMonth = Math.max(1, Math.min(31, d.perMonth + +s.dataset.st));
      drawOpt();
    };
    $('#hName', el).oninput = prev;
    $('#hEmoji', el).oninput = e => { d.emoji = e.target.value.trim(); prev(); };
    $('#hFile', el).onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try { d.img = await readImage(f, 160); prev(); } catch { toast('Не получилось открыть картинку'); }
    };
    $('#hNoImg', el).onclick = () => { d.img = null; d.emoji = ''; $('#hEmoji', el).value = ''; prev(); };
    $('#hSave', el).onclick = () => {
      d.name = $('#hName', el).value.trim();
      if (!d.name) return toast('Введите название');
      if (d.mode === 'weekdays' && !d.days.length) return toast('Выберите дни недели');
      if (d.mode === 'dates' && !d.dates.length) return toast('Выберите числа месяца');
      if (isNew) hb.habits.push(d); else hb.habits[hb.habits.findIndex(x => x.id === d.id)] = d;
      saveHb(); close(); done();
    };
    const del = $('#hDel', el);
    del && (del.onclick = () => { close(); askDeleteHabit(hb.habits.find(x => x.id === d.id), done); });
  });
}

/* =========================================================
   Цели: Активные / Закрытые / Хранилище
   ========================================================= */
let gl = store.get('pl.goals', { goals: [] });
const saveGl = () => store.set('pl.goals', gl);
const gui = { tab: 'active' };
const kDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = kDate(k); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((kDate(b) - kDate(a)) / 864e5);
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c; };
const dd = n => `${n} ${plural(n, 'день', 'дня', 'дней')}`;
const human = k => { const d = kDate(k); return `${d.getDate()} ${MONTHS_G[d.getMonth()]}${d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''}`; };

function goalInfo(g){
  const t = todayKey(), done = g.steps.filter(s => s.done).length, total = g.steps.length;
  const r = { done, total, p: total ? done / total : 0, text: '', cls: '' };
  if (g.status === 'vault') { r.text = `срок ${dd(g.days)}`; return r; }
  if (g.status === 'closed') {
    const late = g.deadline ? diffDays(g.deadline, g.closedAt) : 0;
    r.text = `закрыта ${human(g.closedAt)}` + (late > 0 ? `, опоздание ${dd(late)}` : ', в срок');
    r.cls = late > 0 ? 'warn' : 'ok'; r.p = 1; return r;
  }
  const left = diffDays(t, g.deadline), span = Math.max(1, diffDays(g.start, g.deadline));
  if (left > 0) r.text = `осталось ${dd(left)}, до ${human(g.deadline)}`;
  else if (left === 0) r.text = 'сегодня последний день';
  else r.text = `просрочена на ${dd(-left)}`;
  r.cls = left < 0 ? 'bad' : left / span < .2 ? 'warn' : 'ok';
  r.time = Math.min(1, Math.max(0, 1 - left / span));
  return r;
}
function goalIcon(g){
  if (g.img) return `<img src="${g.img}" alt="">`;
  if (g.emoji) return esc(g.emoji);
  return esc((g.title || '?').trim().charAt(0).toUpperCase());
}
function activateGoal(g){
  g.status = 'active'; g.start = todayKey(); g.deadline = addDays(g.start, g.days || 30);
  g.steps.forEach(s => s.done = false); g.closedAt = null;
}

function renderGoals(tile){
  app.innerHTML = barHTML(tile.title) + `
  <main class="hab-page">
    <div class="seg" id="gseg"></div>
    <ul class="goals" id="gl"></ul>
  </main>
  <button class="fab" id="gAdd">${ICON.plus}Цель</button>`;
  const TABS = { active: 'Активные', closed: 'Закрытые', vault: 'Хранилище' };
  const draw = () => {
    $('#gseg').innerHTML = Object.entries(TABS).map(([k, v]) => {
      const n = gl.goals.filter(g => g.status === k).length;
      return `<button data-tab="${k}" class="${gui.tab === k ? 'on' : ''}">${v}${n ? ` <span class="cnt">${n}</span>` : ''}</button>`;
    }).join('');
    $('#gAdd').classList.toggle('hidden', gui.tab === 'closed');
    let list = gl.goals.filter(g => g.status === gui.tab);
    if (gui.tab === 'active') list.sort((a, b) => a.deadline.localeCompare(b.deadline));
    if (gui.tab === 'closed') list.sort((a, b) => b.closedAt.localeCompare(a.closedAt));
    const EMPTY = {
      active: 'Активных целей нет. Добавьте новую или перенесите из хранилища.',
      closed: 'Здесь появятся цели, у которых выполнены все шаги.',
      vault: 'Храните здесь цели на будущее. Отсчёт срока начнётся, когда перенесёте цель в активные.'
    };
    $('#gl').innerHTML = list.length ? list.map(g => {
      const i = goalInfo(g);
      return `<li class="goal ${g.status}" data-id="${g.id}" tabindex="0" role="button">
        <div class="g-img" style="--c:${tile.color}">${goalIcon(g)}</div>
        <div class="g-main">
          <div class="g-title">${esc(g.title)}</div>
          <div class="g-meta"><span class="dl ${i.cls}">${i.text}</span></div>
          <div class="g-prog">
            <div class="hab-bar"><i style="width:${i.p * 100}%;background:${g.status === 'vault' ? 'var(--muted)' : pctColor(i.p)}"></i></div>
            <span>${i.total ? `${i.done}/${i.total}` : 'без шагов'}</span>
          </div>
          ${g.status === 'vault' ? `<button class="g-act" data-act="go">В активные</button>` : ''}
        </div>
      </li>`;
    }).join('') : `<li class="hint">${EMPTY[gui.tab]}</li>`;
  };
  draw();
  $('#gseg').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) { gui.tab = b.dataset.tab; draw(); } };
  $('#gl').onclick = e => {
    const li = e.target.closest('.goal'); if (!li) return;
    const g = gl.goals.find(x => x.id === li.dataset.id);
    if (e.target.closest('[data-act=go]')) {
      activateGoal(g); saveGl();
      toast(`Цель в активных, срок до ${human(g.deadline)}`);
      return draw();
    }
    goalPreview(g, tile, draw);
  };
  $('#gl').onkeydown = e => { if (e.key === 'Enter') { const li = e.target.closest('.goal'); li && li.click(); } };
  $('#gAdd').onclick = () => goalEditor(null, gui.tab, tile, draw);
  $('#back').onclick = () => location.hash = '';
  document.onkeydown = e => { if (e.key === 'Escape' && !document.querySelector('.scrim')) location.hash = ''; };
}

function goalPreview(g, tile, done){
  const vault = g.status === 'vault';
  const paint = el => {
    const i = goalInfo(g);
    $('#gpBody', el).innerHTML = `
      <div class="gp-head">
        <div class="g-img big" style="--c:${tile.color}">${goalIcon(g)}</div>
        <div><h2 style="margin:0 0 4px">${esc(g.title)}</h2><div class="dl ${i.cls}">${i.text}</div></div>
      </div>
      ${g.status === 'active' && i.time != null ? `<div class="gp-time"><span>время</span><div class="hab-bar"><i style="width:${i.time * 100}%;background:var(--muted)"></i></div></div>` : ''}
      ${g.status !== 'vault' && i.total ? `<div class="gp-time"><span>шаги</span><div class="hab-bar"><i style="width:${i.p * 100}%;background:${pctColor(i.p)}"></i></div></div>` : ''}
      ${g.steps.length ? `<ul class="steps">${g.steps.map(s => `
        <li><button class="chk${s.done ? ' on' : ''}" data-s="${s.id}" ${vault ? 'disabled' : ''} aria-pressed="${s.done}">${CHECK}</button><span class="${s.done ? 'sdone' : ''}">${esc(s.text)}</span></li>`).join('')}</ul>`
        : '<p style="color:var(--muted)">Шагов нет.</p>'}
      ${vault ? '<p class="plan-prev">Шаги можно будет отмечать после переноса в активные.</p>' : ''}`;
  };
  sheet(`<div id="gpBody"></div>
    <div class="row-actions">
      <button class="btn" id="gpEdit">Изменить</button>
      ${vault ? '<button class="btn primary" id="gpGo">В активные</button>' : ''}
      ${g.status === 'active' && !g.steps.length ? '<button class="btn primary" id="gpDone">Выполнена</button>' : ''}
    </div>`, (el, close) => {
    paint(el);
    $('#gpBody', el).onclick = e => {
      const b = e.target.closest('[data-s]'); if (!b || vault) return;
      const s = g.steps.find(x => x.id === b.dataset.s); s.done = !s.done;
      navigator.vibrate && navigator.vibrate(10);
      const all = g.steps.every(x => x.done);
      if (g.status === 'active' && all) {
        g.status = 'closed'; g.closedAt = todayKey(); saveGl(); close(); done();
        toast('Цель выполнена и перенесена в «Закрытые» 🎉'); return;
      }
      if (g.status === 'closed' && !all) { g.status = 'active'; g.closedAt = null; toast('Цель снова в активных'); saveGl(); close(); done(); return; }
      saveGl(); paint(el); done();
    };
    $('#gpEdit', el).onclick = () => { close(); goalEditor(g, g.status, tile, done); };
    const go = $('#gpGo', el);
    go && (go.onclick = () => { activateGoal(g); saveGl(); close(); done(); toast(`Цель в активных, срок до ${human(g.deadline)}`); });
    const fin = $('#gpDone', el);
    fin && (fin.onclick = () => { g.status = 'closed'; g.closedAt = todayKey(); saveGl(); close(); done(); toast('Цель выполнена 🎉'); });
  });
}

function goalEditor(g, status, tile, done){
  const isNew = !g, t = todayKey();
  const d = g ? JSON.parse(JSON.stringify(g)) : { id: uid(), title: '', img: null, emoji: '', status: status === 'vault' ? 'vault' : 'active', days: 30, start: t, deadline: addDays(t, 30), steps: [], created: t, closedAt: null };
  const base = () => d.status === 'vault' ? t : (d.start || t);
  if (!d.deadline) d.deadline = addDays(base(), d.days);
  sheet(`
    <h2>${isNew ? (d.status === 'vault' ? 'Цель в хранилище' : 'Новая цель') : 'Цель'}</h2>
    <label class="field"><span>Название</span><input class="inp" id="gName" value="${esc(d.title)}" maxlength="60" enterkeyhint="next"></label>
    <div class="field"><span>Картинка или эмодзи</span>
      <div class="imgrow">
        <span class="g-img big" id="gPrev" style="--c:${tile.color}">${goalIcon(d)}</span>
        <label class="btn filebtn" style="flex:none;padding:0 14px;display:grid;place-items:center">Картинка<input type="file" accept="image/*" id="gFile"></label>
        <input class="inp" id="gEmoji" value="${esc(d.emoji || '')}" placeholder="🎯" maxlength="4" style="width:64px;text-align:center;font-size:20px" aria-label="Эмодзи">
        <button class="btn" style="flex:none;padding:0 12px" id="gNoImg" aria-label="Убрать картинку">✕</button>
      </div>
    </div>
    <div class="field"><span>${d.status === 'vault' ? 'Срок (отсчёт начнётся после переноса в активные)' : 'Срок'}</span>
      <div class="term">
        <input class="inp" id="gDays" type="number" min="1" max="3650" inputmode="numeric" value="${d.days}">
        <span id="gDaysW">${plural(d.days, 'день', 'дня', 'дней')}</span>
        <span class="or">до</span>
        <input class="inp" id="gDate" type="date" value="${d.deadline}" min="${addDays(base(), 1)}">
      </div>
    </div>
    <div class="field"><span>Шаги</span>
      <ul class="steps edit" id="gSteps"></ul>
      <div class="addrow"><input class="inp" id="gStepIn" placeholder="Новый шаг" enterkeyhint="done"><button class="btn primary" id="gStepAdd">Добавить</button></div>
    </div>
    <div class="row-actions">
      ${isNew ? '' : '<button class="btn danger" id="gDel">Удалить</button>'}
      <button class="btn primary" id="gSave">Сохранить</button>
    </div>`, (el, close) => {
    const prev = () => $('#gPrev', el).innerHTML = goalIcon({ ...d, title: $('#gName', el).value || d.title });
    const drawSteps = () => {
      $('#gSteps', el).innerHTML = d.steps.map((s, i) => `<li><span class="n">${i + 1}.</span><input class="inp" data-i="${i}" value="${esc(s.text)}"><button class="ibtn" data-del="${i}" aria-label="Удалить шаг">${ICON.trash}</button></li>`).join('');
    };
    drawSteps();
    const days = $('#gDays', el), date = $('#gDate', el);
    days.oninput = () => {
      d.days = Math.max(1, Math.min(3650, +days.value || 1));
      d.deadline = addDays(base(), d.days); date.value = d.deadline;
      $('#gDaysW', el).textContent = plural(d.days, 'день', 'дня', 'дней');
    };
    date.onchange = () => {
      if (!date.value) return;
      d.days = Math.max(1, diffDays(base(), date.value)); d.deadline = addDays(base(), d.days);
      days.value = d.days; date.value = d.deadline; $('#gDaysW', el).textContent = plural(d.days, 'день', 'дня', 'дней');
    };
    $('#gSteps', el).oninput = e => { const i = e.target.dataset.i; if (i != null) d.steps[i].text = e.target.value; };
    $('#gSteps', el).onclick = e => { const b = e.target.closest('[data-del]'); if (b) { d.steps.splice(+b.dataset.del, 1); drawSteps(); } };
    const addStep = () => {
      const v = $('#gStepIn', el).value.trim(); if (!v) return;
      d.steps.push({ id: uid(), text: v, done: false }); $('#gStepIn', el).value = ''; drawSteps(); $('#gStepIn', el).focus();
    };
    $('#gStepAdd', el).onclick = addStep;
    $('#gStepIn', el).onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); addStep(); } };
    $('#gName', el).oninput = prev;
    $('#gName', el).onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#gStepIn', el).focus(); } };
    $('#gEmoji', el).oninput = e => { d.emoji = e.target.value.trim(); prev(); };
    $('#gFile', el).onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try { d.img = await readImage(f, 240); prev(); } catch { toast('Не получилось открыть картинку'); }
    };
    $('#gNoImg', el).onclick = () => { d.img = null; d.emoji = ''; $('#gEmoji', el).value = ''; prev(); };
    $('#gSave', el).onclick = () => {
      d.title = $('#gName', el).value.trim();
      if (!d.title) return toast('Введите название цели');
      d.steps = d.steps.filter(s => s.text.trim());
      if (d.status === 'active' && d.steps.length && d.steps.every(s => s.done)) { d.status = 'closed'; d.closedAt = t; }
      if (isNew) gl.goals.push(d); else gl.goals[gl.goals.findIndex(x => x.id === d.id)] = d;
      saveGl(); close(); done();
    };
    const del = $('#gDel', el);
    del && (del.onclick = () => { close(); confirmSheet('Удалить цель?', `«${d.title}» и все её шаги удалятся без возможности восстановления.`, () => { gl.goals = gl.goals.filter(x => x.id !== d.id); saveGl(); done(); }); });
  });
}

const entryEmpty = e => !e || (!e.mood && !(e.feel || []).length && !DQ.some(q => (e[q.k] || '').trim()));

  /* ---------- календарь ---------- */
  function drawCal(){
    const y = dui.cy, m = dui.cm, D = dim(y, m), tk = todayKey();
    const off = isoDow(new Date(y, m, 1)) - 1;
    let cells = WD.map(w => `<div class="wd">${w}</div>`).join('') + '<div></div>'.repeat(off), cnt = 0;
    for (let d = 1; d <= D; d++) {

      const mo = e && e.mood ? MOODS[e.mood - 1] : null;
      const cls = ['d', fut ? 'fut' : mo ? 'has' : e ? 'note' : '', k === tk ? 'today' : ''].join(' ');
      cells += `<button class="${cls}" data-k="${k}" ${fut ? 'disabled' : ''}${mo ? ` style="--dc:${moodColor(mo.v)}"` : ''} aria-label="${d} ${MONTHS_G[m]}${mo ? ', ' + mo.t : e ? ', есть запись' : ''}">${d}${mo ? `<span class="f">${mo.e}</span>` : ''}</button>`;

    $('#cPrev').onclick = () => { dui.cm--; if (dui.cm < 0) { dui.cm = 11; dui.cy--; } drawCal(); };

    };
  }
  draw();
}

/* ---- форматирование ---- */
function fmtMoney(v, cur){
  if (v == null || isNaN(v)) return '—';
  const o = v < 1 ? { maximumSignificantDigits: 4 } : { minimumFractionDigits: 2, maximumFractionDigits: 2 };
  try { return new Intl.NumberFormat('ru-RU', { style: 'currency', currency: cur || 'USD', ...o }).format(v); }
  catch { return new Intl.NumberFormat('ru-RU', o).format(v) + ' ' + (cur || ''); }
}
function fmtCap(usd){
  if (!usd) return '';
  const f = (x, u) => x.toLocaleString('ru-RU', { maximumFractionDigits: x < 10 ? 2 : 1 }) + ' ' + u + ' $';
  return usd >= 1e12 ? f(usd / 1e12, 'трлн') : usd >= 1e9 ? f(usd / 1e9, 'млрд') : f(usd / 1e6, 'млн');
}
const fmtPct = p => (p > 0 ? '+' : p < 0 ? '−' : '') + Math.abs(p || 0).toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';
const usdPrice = (v, cur) => { if (v == null) return null; if (cur === 'USD') return v; const r = mc.fx && mc.fx.rates && mc.fx.rates[cur]; return r ? v / r : null; };
const toUsd = (v, cur) => { if (!v) return 0; const r = mc.fx && mc.fx.rates && mc.fx.rates[cur]; return cur === 'USD' ? v : r ? v / r : 0; };
const ago = ts => ts ? new Date(ts).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';

/* ---- сеть ---- */
async function wget(path){
  if (!mk.worker) throw new Error('noworker');
  let r;
  try { r = await fetch(mk.worker.replace(/\/+$/, '') + path); }
  catch { throw new Error(navigator.onLine ? 'посредник не отвечает (адрес или доступ к workers.dev)' : 'нет интернета'); }
  if (!r.ok) { let m = ''; try { m = (await r.json()).error || ''; } catch {} throw new Error(`посредник ${r.status}${m ? ': ' + m : ''}`); }
  return r.json();
}
async function loadFx(){
  if (mc.fx && Date.now() - mc.fx.ts < 12 * 36e5) return;
  const j = await (await fetch('https://open.er-api.com/v6/latest/USD')).json();
  if (j && j.rates) { mc.fx = { ts: Date.now(), rates: j.rates }; saveMc(); }
}
async function loadStocks(force){
  if (!force && mc.stocks && Date.now() - mc.stocks.ts < 60e3) return;
  await loadFx().catch(() => {});
  // пачками по 40: у бесплатного Cloudflare лимит внешних запросов на один вызов
  const syms = mk.stocks.map(x => x.s), parts = [];
  for (let i = 0; i < syms.length; i += 40) parts.push(syms.slice(i, i + 40));
  const errs = new Set(); let rows = [];
  await Promise.all(parts.map(p => wget('/quotes?s=' + encodeURIComponent(p.join(',')))
    .then(j => { const r = Array.isArray(j) ? j : j.rows || []; rows.push(...r); (j.errors || []).forEach(e => errs.add(e)); })
    .catch(e => errs.add(e.message))));
  if (!rows.length) throw new Error([...errs][0] || 'пустой ответ');
  const prev = (mc.stocks && mc.stocks.data) || {};
  mc.stocks = { ts: Date.now(), data: { ...prev, ...Object.fromEntries(rows.map(q => [q.s, q])) }, warn: [...errs].filter(e => !/запасной путь/.test(e)).join('; ') };
  saveMc();
}
async function loadRub(force){
  if (!force && mc.rub && Date.now() - mc.rub.ts < 30 * 60e3) return;
  const r = await fetch('https://www.cbr-xml-daily.ru/daily_json.js');
  if (!r.ok) throw new Error('ЦБ HTTP ' + r.status);
  mc.rub = { ts: Date.now(), data: await r.json() }; saveMc();
}
async function loadMetals(force){
  if (!force && mc.metals && Date.now() - mc.metals.ts < 3 * 36e5) return;
  if (!mk.worker) return;
  const j = await wget('/metals');
  mc.metals = { ts: Date.now(), hist: j.hist }; saveMc();
}
async function loadCrypto(force){
  if (!force && mc.crypto && Date.now() - mc.crypto.ts < 60e3) return;
  const r = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1&price_change_percentage=24h');
  if (r.status === 429) throw new Error('limit');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  mc.crypto = { ts: Date.now(), data: j.map(c => ({ id: c.id, s: (c.symbol || '').toUpperCase(), name: c.name, img: c.image, price: c.current_price, chg: c.price_change_percentage_24h || 0, cap: c.market_cap, rank: c.market_cap_rank })) };
  saveMc();
}
async function loadChart(kind, id){
  const key = kind + ':' + id, c = mc.charts[key];
  if (c && Date.now() - c.ts < 6 * 36e5) return c;
  let res;
  if (kind === 'stockusd') res = await wget('/chart?usd=1&s=' + encodeURIComponent(id));
  else if (kind === 'cur') res = await wget('/cbrdyn?id=' + encodeURIComponent(id));
  else if (kind === 'metal') { await loadMetals(); return { ts: Date.now(), cur: 'RUB', pts: mc.metals.hist[id] }; }
  else {
    const r = await fetch(`https://api.coingecko.com/api/v3/coins/${encodeURIComponent(id)}/market_chart?vs_currency=usd&days=365&interval=daily`);
    if (r.status === 429) throw new Error('limit');
    const j = await r.json(); res = { cur: 'USD', pts: j.prices };
  }
  mc.charts[key] = { ts: Date.now(), ...res };
  const keys = Object.keys(mc.charts);
  if (keys.length > 30) keys.sort((a, b) => mc.charts[a].ts - mc.charts[b].ts).slice(0, keys.length - 30).forEach(k => delete mc.charts[k]);
  saveMc();
  return mc.charts[key];
}
const errText = e => e.message === 'noworker' ? 'Посредник не настроен' : e.message === 'limit' ? 'Лимит запросов, попробуйте через минуту' : 'Не удалось обновить: ' + e.message;

/* ---------- окно с графиком за год ---------- */
function chartSheet(o){
  sheet(`
    <div class="ch-head">
      <div><h2 style="margin:0">${esc(o.name)}</h2><div class="ms">${esc(o.sub)}${o.cap ? ', ' + fmtCap(o.cap) : ''}</div></div>
      <div class="mp"><div class="pr big">${fmtMoney(o.price, o.cur)}</div>${o.local ? `<div class="ms">${fmtMoney(o.local.price, o.local.cur)} на бирже</div>` : ''}${o.chg != null ? `<div class="ch ${o.chg > 0 ? 'up' : o.chg < 0 ? 'dn' : ''}">${fmtPct(o.chg)} ${o.chgLabel || 'за день'}</div>` : ''}</div>
    </div>
    <div class="chart" id="chart"><div class="hint">Загрузка графика…</div></div>
    <div class="ch-stats" id="chStats"></div>
    <div class="row-actions"><button class="btn" id="chClose">Закрыть</button></div>`, async (el, close) => {
    $('#chClose', el).onclick = close;
    let c;
    try { c = await loadChart(o.kind, o.id); }
    catch (e) { const cached = mc.charts[o.kind + ':' + o.id]; if (cached) c = cached; else { $('#chart', el).innerHTML = `<div class="hint">Не удалось загрузить график: ${esc(e.message === 'noworker' ? 'посредник не настроен' : e.message === 'limit' ? 'лимит запросов, попробуйте через минуту' : e.message)}</div>`; return; } }
    const pts = (c.pts || []).filter(p => p[1] != null);
    if (pts.length < 2) { $('#chart', el).innerHTML = '<div class="hint">Нет данных за год</div>'; return; }
    const cur = c.cur || o.cur, first = pts[0][1];
    const last = cur === o.cur && o.price != null ? o.price : o.local && cur === o.local.cur ? o.local.price : pts[pts.length - 1][1];
    const g = (last / first - 1) * 100;
    if (o.local && cur !== 'USD') $('#chStats', el).insertAdjacentHTML('beforebegin', '<div class="legend" style="text-align:left">График в местной валюте: курс для пересчёта не загрузился</div>');
    drawChart($('#chart', el), pts, cur, g >= 0);
    const d0 = new Date(pts[0][0]);
    $('#chStats', el).innerHTML = `
      <div><span>${d0.getDate()} ${MONTHS_G[d0.getMonth()].slice(0, 3)} ${d0.getFullYear()}</span><b>${fmtMoney(first, cur)}</b></div>
      <div><span>Сейчас</span><b>${fmtMoney(last, cur)}</b></div>
      <div><span>За год</span><b class="${g >= 0 ? 'up' : 'dn'}">${fmtPct(g)}</b></div>`;
  });
}
function drawChart(box, pts, cur, up){
  const W = 340, H = 170, P = 6;
  const ys = pts.map(p => p[1]), min = Math.min(...ys), max = Math.max(...ys), t0 = pts[0][0], t1 = pts[pts.length - 1][0];
  const X = t => P + (t - t0) / (t1 - t0 || 1) * (W - 2 * P), Y = v => P + (1 - (v - min) / (max - min || 1)) * (H - 2 * P);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join('');
  const col = up ? '#3f9a5d' : 'var(--danger)';
  box.innerHTML = `
    <div class="ch-tip" id="chTip"></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" id="chSvg">
      <defs><linearGradient id="chG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${up ? '#3f9a5d' : '#e5707a'}" stop-opacity=".28"/><stop offset="1" stop-color="${up ? '#3f9a5d' : '#e5707a'}" stop-opacity="0"/></linearGradient></defs>
      <path d="${line}L${X(t1).toFixed(1)},${H}L${X(t0).toFixed(1)},${H}Z" fill="url(#chG)"/>
      <path d="${line}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
      <line id="chX" x1="0" x2="0" y1="0" y2="${H}" stroke="var(--muted)" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0"/>
    </svg>
    <div class="ch-rng"><span>мин ${fmtMoney(min, cur)}</span><span>макс ${fmtMoney(max, cur)}</span></div>`;
  const svg = $('#chSvg', box), tip = $('#chTip', box), xl = $('#chX', box);
  const tipFor = p => { const d = new Date(p[0]); return `${d.getDate()} ${MONTHS_G[d.getMonth()]} ${d.getFullYear()}: <b>${fmtMoney(p[1], cur)}</b>`; };
  tip.innerHTML = tipFor(pts[pts.length - 1]);
  const move = e => {
    const r = svg.getBoundingClientRect(), fx = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    const t = t0 + fx * (t1 - t0);
    let best = pts[0]; for (const p of pts) if (Math.abs(p[0] - t) < Math.abs(best[0] - t)) best = p;
    const x = X(best[0]); xl.setAttribute('x1', x); xl.setAttribute('x2', x); xl.setAttribute('opacity', 1);
    tip.innerHTML = tipFor(best);
  };
  svg.addEventListener('pointerdown', move); svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerleave', () => { xl.setAttribute('opacity', 0); tip.innerHTML = tipFor(pts[pts.length - 1]); });
}

let kn = store.get('pl.know', { items: [], used: [], lastGen: '', perDay: 3 });
const saveKn = () => store.set('pl.know', kn);
const kui = { tab: 'learn', q: '' };

// Алгоритм выдачи: берём ещё не выданные темы, стараемся взять разные сферы
// и не повторять сферы, которые были в последних 9 темах. Когда банк
// закончится, темы будут приходить случайными большими статьями Википедии.
function pickTopics(n){
  const used = new Set(kn.used), pool = KBANK.filter(t => !used.has(t.b));
  const recent = kn.items.slice(-9).map(i => i.cat);
  const out = [];
  for (let k = 0; k < n && pool.length; k++) {
    const cats = [...new Set(pool.map(t => t.cat))].filter(c => !out.some(o => o.cat === c));
    const fresh = cats.filter(c => !recent.includes(c));
    const cp = (fresh.length ? fresh : cats.length ? cats : [pool[0].cat]);
    const cat = cp[Math.floor(Math.random() * cp.length)];
    const opts = pool.filter(t => t.cat === cat);
    const t = opts[Math.floor(Math.random() * opts.length)];
    out.push(t); pool.splice(pool.indexOf(t), 1);
  }
  return out;
}
const KBANK = KBANK_RAW;
function addTopic(t){
  kn.items.push({ id: uid(), b: t.b, cat: t.cat, title: t.title, q: t.q, wiki: t.wiki, added: todayKey(), status: 'learn', note: '', doneAt: null });
  if (t.b != null) kn.used.push(t.b);
}
async function wikiRandomTopic(){
  // случайная, но достаточно большая статья, чтобы было что изучать
  for (let i = 0; i < 4; i++) {
    const j = await (await fetch('https://ru.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=random&grnnamespace=0&grnlimit=10&prop=info')).json();
    const pages = Object.values(j.query.pages).filter(p => p.length > 40000 && !/^(Список|Категория)/.test(p.title));
    if (pages.length) { const p = pages[0]; return { b: null, cat: 'wiki', title: p.title, q: 'Что это и почему об этом стоит знать?', wiki: p.title }; }
  }
  throw new Error('no article');
}
async function ensureDaily(){
  const t = todayKey();
  if (kn.lastGen === t) return false;
  const picked = pickTopics(kn.perDay);
  picked.forEach(addTopic);
  for (let k = picked.length; k < kn.perDay; k++) {
    try { addTopic(await wikiRandomTopic()); } catch { break; }
  }
  kn.lastGen = t; saveKn();
  return true;
}
async function wikiSummary(item){
  if (item.wx) return item.wx;
  const u = 'https://ru.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=extracts|info&inprop=url&exintro=1&explaintext=1&exsentences=7&generator=search&gsrlimit=1&gsrsearch=' + encodeURIComponent(item.wiki || item.title);
  const j = await (await fetch(u)).json();
  const p = j.query && Object.values(j.query.pages)[0];
  if (!p) throw new Error('не найдено');
  item.wx = { title: p.title, text: p.extract, url: p.fullurl }; saveKn();
  return item.wx;
}

function renderKnow(tile){

    <div id="kv"></div>
  </main>`;
  const draw = () => {
    document.querySelectorAll('#kseg button').forEach(b => b.classList.toggle('on', b.dataset.tab === kui.tab));
    kui.tab === 'learn' ? drawLearn() : drawDone();
  };
  $('#kseg').onclick = e => { const b = e.target.closest('button'); if (b) { kui.tab = b.dataset.tab; draw(); } };
  $('#kSet').onclick = () => knowSettings(draw);
  $('#back').onclick = () => location.hash = '';
  document.onkeydown = e => { if (e.key === 'Escape' && !document.querySelector('.scrim')) location.hash = ''; };

  const card = i => {
    const [cn, cc] = KCAT[i.cat] || KCAT.own, isNew = i.added === todayKey() && i.status === 'learn';
    return `<li class="kcard swipe-host" data-id="${i.id}" style="--kc:${cc}">
      <div class="swipe"></div>
      <div class="card">
        <div class="kmeta"><span class="kcat">${cn}</span>${isNew ? '<span class="knew">сегодня</span>' : ''}<span class="kdate">${i.status === 'done' ? 'изучено ' + human(i.doneAt) : human(i.added)}</span></div>
        <div class="ktitle">${esc(i.title)}</div>
        <div class="kq">${esc(i.status === 'done' && i.note ? i.note.slice(0, 180) + (i.note.length > 180 ? '…' : '') : i.q)}</div>
      </div></li>`;
  };
  function drawLearn(){
    const list = kn.items.filter(i => i.status === 'learn').sort((a, b) => b.added.localeCompare(a.added));
    const left = KBANK.length - kn.used.length;
    $('#kv').innerHTML = `
      <div class="kintro">${list.length ? `Тем в работе: <b>${list.length}</b>. Откройте тему, разберитесь и запишите, что узнали.` : 'Все темы разобраны. Новые появятся завтра.'}</div>
      <ul class="klist" id="kl">${list.map(card).join('')}</ul>
      <button class="btn add-h" id="kMore">+ Ещё тема сегодня</button>
      <div class="legend" style="margin-top:10px">${left > 0 ? `В запасе ещё ${left} ${plural(left, 'тема', 'темы', 'тем')}, потом темы будут приходить из Википедии` : 'Темы берутся из Википедии'}</div>`;
    $('#kMore').onclick = async () => {
      const [t] = pickTopics(1);
      try { addTopic(t || await wikiRandomTopic()); saveKn(); drawLearn(); } catch { toast('Нет новой темы: нужен интернет'); }
    };
    bindList();
  }
  function drawDone(){
    const q = kui.q.trim().toLowerCase();
    let list = kn.items.filter(i => i.status === 'done').sort((a, b) => b.doneAt.localeCompare(a.doneAt));
    const total = list.length;
    if (q) list = list.filter(i => [i.title, i.q, i.note, (KCAT[i.cat] || KCAT.own)[0]].join(' ').toLowerCase().includes(q));
    $('#kv').innerHTML = `
      <div class="search" style="margin:0 0 12px">${ICON.search}<input id="kq" type="search" placeholder="Поиск по заголовкам и записям" enterkeyhint="search" autocomplete="off" value="${esc(kui.q)}"></div>
      <div class="kintro">${total ? `Изучено тем: <b>${total}</b>${q ? `, найдено: <b>${list.length}</b>` : ''}` : 'Здесь появятся темы, которые вы разобрали'}</div>
      <ul class="klist" id="kl">${list.map(card).join('')}</ul>`;
    const inp = $('#kq');
    inp.oninput = () => { kui.q = inp.value; const pos = inp.selectionStart; drawDone(); const n = $('#kq'); n.focus(); n.setSelectionRange(pos, pos); };
    bindList();
  }
  function bindList(){
    const kl = $('#kl'); if (!kl) return;
    kl.onclick = e => {
      const li = e.target.closest('.kcard'); if (!li || Date.now() - lastSwipe < 400) return;
      topicSheet(kn.items.find(i => i.id === li.dataset.id), draw);
    };
    kl.querySelectorAll('.kcard').forEach(li => attachSwipe(li, {
      left: { label: 'Удалить', run: reset => {
        const it = kn.items.find(i => i.id === li.dataset.id);
        confirmSheet(it.status === 'done' ? 'Удалить запись?' : 'Пропустить тему?', it.status === 'done' ? `«${it.title}» и ваши заметки удалятся.` : `«${it.title}» уберётся из списка и больше не выпадет.`, () => {
          kn.items = kn.items.filter(i => i.id !== it.id); saveKn(); draw();
        }, reset, it.status === 'done' ? 'Удалить' : 'Пропустить');
      } }
    }));
  }
  ensureDaily().then(added => { if (added && location.hash.startsWith('#t/' + tile.id)) draw(); });
  draw();
}

function topicSheet(it, done){
  const [cn, cc] = KCAT[it.cat] || KCAT.own;
  sheet(`
    <div class="kmeta" style="--kc:${cc}"><span class="kcat">${cn}</span><span class="kdate">${it.status === 'done' ? 'изучено ' + human(it.doneAt) : 'добавлено ' + human(it.added)}</span></div>
    <h2 style="margin:6px 0 6px">${esc(it.title)}</h2>
    <p class="kq big">${esc(it.q)}</p>
    <div class="kwiki" id="kw"><button class="btn" id="kwLoad" style="width:100%">Справка из Википедии</button></div>
    <label class="dq" style="margin-top:16px"><span class="dq-label">Что я узнал</span>
      <textarea id="kNote" rows="4" placeholder="Своими словами: суть, ответ на вопрос, что удивило">${esc(it.note || '')}</textarea></label>
    <div class="legend" id="kSaved" style="text-align:left;margin-top:6px"></div>
    <div class="row-actions">
      ${it.status === 'done' ? '<button class="btn" id="kBack">Вернуть в изучаемые</button>' : '<button class="btn primary" id="kDone">В завершённые</button>'}
    </div>`, (el, close) => {
    const ta = $('#kNote', el);
    const grow = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
    grow();
    let t;
    ta.oninput = () => { it.note = ta.value; grow(); clearTimeout(t); t = setTimeout(() => { saveKn(); $('#kSaved', el).textContent = 'Сохранено'; }, 300); };
    const showWiki = w => {
      $('#kw', el).innerHTML = `<div class="kw-t">${esc(w.title)}</div><p>${esc(w.text || 'Краткого описания нет').replace(/\n/g, '<br>')}</p><a href="${esc(w.url)}" target="_blank" rel="noopener">Читать статью целиком →</a>`;
    };
    const load = async () => {
      $('#kw', el).innerHTML = '<div class="hint" style="padding:10px 0">Загрузка…</div>';
      try { showWiki(await wikiSummary(it)); }
      catch { $('#kw', el).innerHTML = `<div class="legend" style="text-align:left">Не удалось загрузить справку.</div><a href="https://ru.wikipedia.org/w/index.php?search=${encodeURIComponent(it.wiki || it.title)}" target="_blank" rel="noopener">Искать в Википедии →</a>`; }
    };
    if (it.wx) showWiki(it.wx); else $('#kwLoad', el).onclick = load;
    const d = $('#kDone', el);
    d && (d.onclick = () => {
      if (!it.note.trim()) { toast('Сначала запишите, что узнали'); return; }
      it.status = 'done'; it.doneAt = todayKey(); saveKn(); close(); done(); toast('Тема в завершённых');
    });
    const bk = $('#kBack', el);
    bk && (bk.onclick = () => { it.status = 'learn'; it.doneAt = null; saveKn(); close(); done(); });
  }, () => { saveKn(); done(); });
}

const TILE_KEYS = { notes: ['pl.notes', 'pl.lp'], habits: ['pl.habits'], goals: ['pl.goals'], diary: ['pl.diary'], market: ['pl.market', 'pl.mcache'], know: ['pl.know'], breath: [] };
const TILE_DEFAULT = {
  habits: { title: 'Привычки', color: '#6b8afd' },
  breath: { title: 'Дыхание',  color: '#f2a65a' },
  goals:  { title: 'Цели',     color: '#7cc6a4' },
  notes:  { title: 'Заметки',  color: '#e8e4da' },
  diary:  { title: 'Дневник',  color: '#a78bfa' },
  market: { title: 'Рынки',    color: '#5fb3d9' },
  know:   { title: 'Знания',   color: '#f4d35e' }
};
async function exportTile(tile){
  const data = {};
  (TILE_KEYS[tile.type] || []).forEach(k => { const v = store.get(k, null); if (v !== null) data[k] = v; });
  const payload = { app: 'plitki', version: 1, type: tile.type, exported: new Date().toISOString(), tile: { title: tile.title, color: tile.color, img: tile.img }, data };
  const name = `plitki-${tile.type}-${todayKey()}.json`;
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const file = new File([blob], name, { type: 'application/json' });
  if (/iPhone|iPad/.test(navigator.userAgent) && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; } catch { return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Файл сохранён в загрузки');
}
function importTile(tile, file){
  const fr = new FileReader();
  fr.onload = () => {
    let o; try { o = JSON.parse(fr.result); } catch { return toast('Файл не читается: это не JSON'); }
    if (!o || o.app !== 'plitki' || !o.data) return toast('Это не выгрузка из этого приложения');
    if (o.type !== tile.type) return toast(`Файл от другой плитки (${TILE_DEFAULT[o.type]?.title || o.type})`);
    confirmSheet('Заменить данные?', `Текущие данные плитки «${tile.title}» заменятся данными из файла от ${new Date(o.exported).toLocaleDateString('ru-RU')}.`, () => {
      (TILE_KEYS[tile.type] || []).forEach(k => localStorage.removeItem(k));
      Object.entries(o.data).forEach(([k, v]) => { if ((TILE_KEYS[tile.type] || []).includes(k)) store.set(k, v); });
      if (o.tile) Object.assign(tile, { title: o.tile.title || tile.title, color: o.tile.color || tile.color, img: o.tile.img || null });
      saveTiles(); location.reload();
    }, null, 'Заменить');
  };
  fr.readAsText(file);
}
function resetTile(tile){
  confirmSheet('Сбросить плитку?', `Все данные и настройки плитки «${tile.title}» удалятся полностью, название, цвет и картинка вернутся к исходным. Отменить нельзя. Если нужна копия, сначала выгрузите данные.`, () => {
    (TILE_KEYS[tile.type] || []).forEach(k => localStorage.removeItem(k));
    Object.assign(tile, TILE_DEFAULT[tile.type] || {}, { img: null });
    saveTiles(); location.reload();
  }, null, 'Сбросить');
}



/* =========================================================
   Мини-рендер Markdown

 (без внешних библиотек — работает офлайн)
   ========================================================= */
function inline(s){
  s = esc(s);
  const codes = [], links = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  s = s
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, a, u) => /^(https?:|data:image\/)/.test(u) ? `<img alt="${a}" src="${u}">` : m)
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => { links.push(/^(https?:|mailto:|tel:)/.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : t); return `\u0001${links.length - 1}\u0001`; })
    .replace(/(^|[\s(])(https?:\/\/[^\s<]+[^\s<.,;:!?)'"])/g, (m, pre, u) => { links.push(`<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\/(www\.)?/, '').slice(0, 48)}</a>`); return `${pre}\u0001${links.length - 1}\u0001`; })
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/__([^_]+)__/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/(^|[^\p{L}\p{N}_])_([^_]+)_(?![\p{L}\p{N}])/gu, '$1<em>$2</em>')
    .replace(/~~([^~]+)~~/g, '<del>$1</del>')
    .replace(/(^|\s)#([\p{L}\p{N}_-]+)/gu, '$1<span class="md-tag">#$2</span>');
  return s.replace(/\u0001(\d+)\u0001/g, (_, i) => links[i]).replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
}
function md(src){
  const L = src.replace(/\r/g, '').split('\n');
  let i = 0, h = '';
  const isBlock = l => /^(```|#{1,6} |> ?|\s*([-*+]|\d+\.) |(-{3,}|\*{3,})\s*$)/.test(l);
  while (i < L.length) {
    const l = L[i];
    if (!l.trim()) { i++; continue; }
    if (l.startsWith('```')) {
      const buf = []; i++;
      while (i < L.length && !L[i].startsWith('```')) buf.push(L[i++]);
      i++; h += `<pre><code>${esc(buf.join('\n'))}</code></pre>`; continue;
    }
    let m;
    if ((m = l.match(/^(#{1,6}) +(.*)/))) { h += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; i++; continue; }
    if (/^(-{3,}|\*{3,})\s*$/.test(l)) { h += '<hr>'; i++; continue; }
    if (/^> ?/.test(l)) {
      const buf = [];
      while (i < L.length && /^> ?/.test(L[i])) buf.push(L[i++].replace(/^> ?/, ''));
      h += `<blockquote>${md(buf.join('\n'))}</blockquote>`; continue;
    }
    if (/^\s*([-*+]|\d+\.) /.test(l)) {
      const ordered = /^\s*\d+\./.test(l);
      h += ordered ? '<ol>' : '<ul>';
      while (i < L.length && /^\s*([-*+]|\d+\.) /.test(L[i])) {
        const item = L[i].replace(/^\s*([-*+]|\d+\.) /, '');
        const tk = item.match(/^\[( |x|X)\] (.*)/);
        h += tk
          ? `<li class="task"><input type="checkbox" data-line="${i}"${tk[1] !== ' ' ? ' checked' : ''}>${inline(tk[2])}</li>`
          : `<li>${inline(item)}</li>`;
        i++;
      }
      h += ordered ? '</ol>' : '</ul>'; continue;
    }
    const buf = [];
    while (i < L.length && L[i].trim() && !isBlock(L[i])) buf.push(inline(L[i++]));
    h += `<p>${buf.join('<br>')}</p>`;
  }
  return h || '<p style="color:var(--muted)">Пусто</p>';
}

/* =========================================================
   Клавиатура телефона: панель инструментов держится над ней
   ========================================================= */
function fitKb(){
  const vv = window.visualViewport; if (!vv) return;
  const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
  document.documentElement.style.setProperty('--kb', kb + 'px');
}
if (window.visualViewport) { visualViewport.addEventListener('resize', fitKb); visualViewport.addEventListener('scroll', fitKb); }

/* =========================================================
   Старт
   ========================================================= */
route();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
